<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>벙커 – 좀비 방치형</title>
<style>
  :root { --ink: #1c1b19; --muted: #7d796f; --paper: #fff; --line: #d9d5cc; --bad: #c0392b; --top: 74px; --bottom: 268px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 13px/1.4 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }

  /* top: resources, wave, speed, settings */
  #top { position: fixed; top: 0; left: 0; right: 0; height: var(--top); padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left)); display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
  #res { display: grid; grid-template-columns: repeat(4, auto); gap: 2px 12px; align-items: center; justify-content: start; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ico { width: 11px; height: 11px; border: 1px solid var(--ink); flex: none; }
  .ico.money { background: #f5c518; border-radius: 50%; }
  .ico.food { background: #e07a3c; }
  .ico.mineral { background: #7c9cc4; transform: rotate(45deg) scale(.85); }
  .ico.wood { background: #9a6a3c; }
  .rate { color: var(--muted); font-weight: 400; font-size: 11px; }
  #waveLine { grid-column: 1 / -1; color: var(--muted); }
  #topBtns { display: flex; gap: 6px; flex: none; }
  .tbtn { background: #fff; border: 1px solid var(--ink); padding: 6px 10px; cursor: pointer; min-height: 34px; white-space: nowrap; }
  .tbtn[aria-pressed="true"] { background: var(--ink); color: #fff; }

  /* stage and hp overlay */
  #stage { position: fixed; left: 0; right: 0; top: var(--top); bottom: var(--bottom); display: grid; place-items: center; overflow: hidden; }
  canvas { display: block; image-rendering: pixelated; touch-action: manipulation; cursor: crosshair; outline: none; }
  #hp { position: fixed; left: max(8px, env(safe-area-inset-left)); bottom: calc(var(--bottom) + 8px); background: rgba(255, 255, 255, .9); border: 1px solid var(--ink); padding: 6px 8px; display: grid; grid-template-columns: auto 80px; gap: 4px 8px; align-items: center; pointer-events: none; font-size: 12px; }
  #hp .lbl { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .track { height: 8px; border: 1px solid var(--ink); background: #fff; }
  .fill { height: 100%; background: #6aa64a; width: 0; }
  #fenceFill { background: #a0784a; }
  .hurt .fill { background: #d0503c; }
  #status { position: fixed; left: 0; right: 0; top: calc(var(--top) + 4px); text-align: center; pointer-events: none; color: var(--muted); padding: 0 12px; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
  #status.alert { color: var(--bad); font-weight: 700; }

  /* bottom: panel and tab bar */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; height: var(--bottom); border-top: 1px solid var(--ink); background: #fff; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
  #panel { flex: 1; overflow-y: auto; padding: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; align-content: start; }
  #tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--ink); flex: none; }
  .tab { background: #fff; border: 0; border-right: 1px solid var(--line); padding: 11px 4px; cursor: pointer; font-weight: 700; }
  .tab:last-child { border-right: 0; }
  .tab[aria-selected="true"] { background: var(--ink); color: #fff; }
  .card { text-align: left; background: #fff; border: 1px solid var(--ink); padding: 7px 8px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .card:active:not(.off) { transform: translateY(1px); }
  .card.off { border-color: var(--line); cursor: default; }
  .card .head { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .card .name { font-weight: 700; }
  .card .lv { color: var(--muted); }
  .card .desc { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .card .cost { display: flex; flex-wrap: wrap; gap: 2px 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .cost .short { color: var(--bad); }
  .card.max .cost { color: var(--muted); }
  .row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
  .mini { background: #fff; border: 1px solid var(--ink); padding: 5px 8px; cursor: pointer; font-size: 12px; }
  .mini[disabled] { background: var(--ink); color: #fff; cursor: default; }

  /* settings */
  dialog { border: 1px solid var(--ink); padding: 16px; width: min(320px, calc(100vw - 32px)); font: inherit; color: var(--ink); }
  dialog::backdrop { background: rgba(255, 255, 255, .75); }
  dialog h2 { margin: 0 0 12px; font-size: 15px; }
  .set { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .set input[type=range] { width: 130px; }
  .set .mini[disabled] { background: #fff; color: var(--ink); }
  .danger { color: var(--bad); border-color: var(--bad); }
  @media (max-width: 440px) { :root { --top: 80px; } #res { grid-template-columns: repeat(2, auto); } .tbtn { padding: 6px 8px; } #panel { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div id="top">
  <div id="res">
    <span class="chip"><i class="ico money"></i><span id="r-money">0</span></span>
    <span class="chip"><i class="ico food"></i><span id="r-food">0</span><span class="rate" id="rr-food"></span></span>
    <span class="chip"><i class="ico mineral"></i><span id="r-mineral">0</span><span class="rate" id="rr-mineral"></span></span>
    <span class="chip"><i class="ico wood"></i><span id="r-wood">0</span><span class="rate" id="rr-wood"></span></span>
    <span id="waveLine"></span>
  </div>
  <div id="topBtns">

    <button class="tbtn" id="settingsBtn" type="button">설정</button>
  </div>
</div>
<div id="stage"><canvas id="c" tabindex="0" aria-label="벙커 주변 들판. 화면 밖에서 좀비가 몰려온다. 좀비를 누르면 직접 쏜다."></canvas></div>
<div id="status" role="status" aria-live="polite"></div>
<div id="hp">
  <span class="lbl" id="bunkerText">벙커</span><div class="track" id="bunkerTrack"><div class="fill" id="bunkerFill"></div></div>
  <span class="lbl" id="fenceText">울타리 없음</span><div class="track"><div class="fill" id="fenceFill"></div></div>
</div>
<div id="bottom">
  <div id="panel"></div>
  <div id="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="gun" aria-selected="true">무기</button>
    <button class="tab" role="tab" data-tab="build" aria-selected="false">건설</button>
    <button class="tab" role="tab" data-tab="crew" aria-selected="false">인원</button>
  </div>
</div>
<dialog id="settings">
  <h2>설정</h2>
  <div class="set"><span>효과음</span><button class="mini" id="soundToggle" type="button">켜짐</button></div>
  <div class="set"><span>음량</span><input type="range" id="volume" min="0" max="100" value="70"></div>
  <div class="set"><span>풀 흔들림</span><button class="mini" id="windToggle" type="button">켜짐</button></div>
  <div class="set"><span>진행 초기화</span><button class="mini danger" id="resetBtn" type="button">초기화</button></div>
  <form method="dialog" style="text-align:right;margin-top:12px"><button class="mini">닫기</button></form>
</dialog>
<script>
// size the game canvas to the stage: every game pixel is a whole number of device pixels,
// and the world scale is chosen so the fenced yard fits with room around it
(() => {
  const r = document.getElementById('stage').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const pick = k => {
    const width = Math.min(1600, Math.floor(r.width * dpr / k)), height = Math.min(900, Math.floor(r.height * dpr / k));
    return { k, width, height, scale: Math.min(44, width / 16.5, height / 11.5) };
  };
  let best = pick(1);
  for (let k = 2; k <= 6; k++) { const c = pick(k); if (c.scale >= 28) best = c; }
  window.PP_SCENE = { width: best.width, height: best.height, scale: best.scale, originY: best.scale * .9, grassDensity: .07 };
})();
</script>
<script src="engine.js"></script>
<script>
'use strict';
/* ================= numbers ================= */
const FENCE_R = 5.2, MAX_ZOMBIES = 40, OFFLINE_CAP = 2 * 3600, SAVE_KEY = 'bunker-idle:v2';
const STAGES = [
  { name: '간이 참호', half: 1.25, roof: 0, hp: 150, cost: null },
  { name: '나무 초소', half: 1.45, roof: 1.7, hp: 400, cost: { money: 80, wood: 30 } },
  { name: '콘크리트 벙커', half: 1.9, roof: 2.1, hp: 1000, cost: { money: 400, wood: 120, mineral: 40 } },
  { name: '강화 벙커', half: 2.05, roof: 2.3, hp: 2500, cost: { money: 2500, wood: 300, mineral: 250 } },
  { name: '요새', half: 2.3, roof: 2.6, hp: 6000, cost: { money: 15000, wood: 800, mineral: 1200 } },
];
const FENCES = [
  { name: '없음', hp: 0 },
  { name: '나무 말뚝', hp: 120, cost: { wood: 15 } },
  { name: '나무 울타리', hp: 300, cost: { money: 40, wood: 50 } },
  { name: '통나무 목책', hp: 700, cost: { money: 200, wood: 150 } },
  { name: '철조망', hp: 1500, cost: { money: 600, wood: 100, mineral: 80 } },
  { name: '철판 벽', hp: 3500, cost: { money: 2000, mineral: 300 } },
  { name: '콘크리트 벽', hp: 8000, cost: { money: 8000, wood: 500, mineral: 1000 } },
];
const BUILD = {
  farm:  { name: '농장', res: 'food', max: 20, rate: L => L ? .3 * L * 1.12 ** L : 0, cost: L => ({ money: Math.ceil(25 * 1.55 ** L) }) },
  saw:   { name: '벌목장', res: 'wood', max: 20, rate: L => L ? .35 * L * 1.12 ** L : 0, cost: L => ({ money: Math.ceil(30 * 1.55 ** L) }) },
  drill: { name: '광산 드릴', res: 'mineral', max: 20, rate: L => L ? .2 * L * 1.12 ** L : 0, cost: L => ({ money: Math.ceil(80 * 1.6 ** L), wood: Math.ceil(15 * 1.5 ** L) }) },
};
const GUN = {
  atk: { name: '공격력', max: 60, cost: L => Math.ceil(15 * 1.45 ** L), val: L => 10 * (1 + .5 * L) * 1.05 ** L },
  spd: { name: '연사', max: 25, cost: L => Math.ceil(20 * 1.5 ** L), val: L => 1 + .12 * L },
  mag: { name: '탄창', max: 25, cost: L => Math.ceil(15 * 1.4 ** L), val: L => 5 + L },
};
const reloadTime = () => 1.6 * .97 ** G.lv.mag;
const JOBS = ['사수', '농부', '광부', '벌목꾼'];
const JOB_RES = { 농부: 'food', 광부: 'mineral', 벌목꾼: 'wood' };
const UPKEEP = .1; // food per second per hired survivor
const hireCost = n => ({ money: Math.ceil(60 * 2.5 ** n), food: 20 + 20 * n });
const zombieHp = w => 25 * 1.16 ** (w - 1);
const zombieHit = w => 4 * 1.12 ** (w - 1);
const zombieReward = w => 6 * 1.14 ** (w - 1);
const killsNeeded = w => 8 + 2 * w;
const spawnEvery = w => Math.max(.35, 3 * .94 ** (w - 1));
const STRIKE_EVERY = 1.2;
const NAMES = ['민준', '서연', '도윤', '하은', '지호'];

/* ================= state ================= */
const G = {
  money: 0, food: 0, mineral: 0, wood: 0,
  lv: { atk: 0, spd: 0, mag: 0 }, stage: 0, fence: 0, build: { farm: 0, saw: 0, drill: 0 },
  crew: [null, null, null, null, null],
  wave: 1, waveKills: 0, totalKills: 0,
  hp: 150, fenceHp: 0, fenceDown: false, sideDmg: [0, 0, 0, 0], sideStage: [0, 0, 0, 0],
  zombies: [], tracers: [], parts: [], decals: [], floats: [], shooters: [], workers: [],
  time: 0, spawnIn: 2, speed: 1, hurt: 0, banner: 0, hungry: false, saveIn: 5, statusT: 0,
};
const stage = () => STAGES[G.stage];
const gunStat = k => GUN[k].val(G.lv[k]);
const hired = () => G.crew.filter(Boolean);
const jobCount = j => G.crew.filter(c => c && c.job === j).length;
const slotsOpen = () => G.stage + 1;
function rateOf(res) {
  // a building's output, boosted by workers on that job; hands without a building still gather a little
  const key = Object.keys(BUILD).find(k => BUILD[k].res === res), L = G.build[key];
  const job = Object.keys(JOB_RES).find(j => JOB_RES[j] === res), n = jobCount(job);
  return (G.hungry ? BUILD[key].rate(L) : BUILD[key].rate(L) * (1 + .5 * n) + n * .15);
}
function fmt(n) {
  n = Math.max(0, n);
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n) + '';
  const units = ['K', 'M', 'B', 'T', 'aa', 'ab', 'ac'];
  let i = -1;
  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
  return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + units[i];
}
const RES_NAME = { money: '$', food: '식량', mineral: '광물', wood: '나무' };
const canPay = c => Object.entries(c).every(([k, v]) => G[k] >= v);
function pay(c) { for (const [k, v] of Object.entries(c)) G[k] -= v; }

/* ================= palette ================= */
const CONCRETE = [176, 172, 160], BAG = [190, 166, 116], WOOD = [150, 106, 66], PLANK = [176, 132, 84], METAL = [148, 158, 166], DARK = [44, 40, 50];
const DIRT = [152, 120, 84], TILLED = [118, 84, 58], CROP = [104, 152, 66], ROCK = [132, 130, 128], ORE = [104, 140, 196], TARP = [96, 116, 82];
const STEP = .45 / S;
const px = n => Math.max(1, Math.round(n * S / 16)); // sizes that follow the pixel grid

/* ================= scene: ground ================= */
const KIND_DIRT = 1;
function groundColor(x, y, ix, iy) {
  const clearing = Math.hypot(x, y) + noise(x * .6, y * .6) * 1.6;
  const patch = noise(x * .18 + 7, y * .18) > .72;
  if (clearing < FENCE_R - .4 || patch) {
    const ramp = rampOf(DIRT), fine = hash(ix, iy);
    if (fine > .985) return [ramp[4], KIND_DIRT];
    if (fine < .01) return [ramp[0], KIND_DIRT];
    return [ramp[clamp(Math.floor(2.1 + noise(x * 1.4, y * 1.4) * 1.3 + (bayerAt(ix, iy) - .5) * .5), 1, 4)], KIND_DIRT];
  }
  const tone = noise(x * .25, y * .25) * 1.5 + noise(x * 1.1 + 4, y * 1.1) * .7;
  return [tuftLit[clamp(Math.floor(1 + tone + (bayerAt(ix, iy) - .5) * .5), 0, 4)], KIND_GRASS];
}
const groundPix = new Uint32Array(W * H), groundKinds = new Uint8Array(W * H), groundDepth = new Float32Array(W * H);
function bakeGround() {
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const g = unproject(ix + .5, iy + .5), [c, kind] = groundColor(g.x, g.y, ix, iy), i = iy * W + ix;
    groundPix[i] = c; groundKinds[i] = kind;
    groundDepth[i] = (g.x + g.y) / R2 * COS;
  }
}
// trees and rocks out by the edges of the screen, away from the yard
function sceneryPoints() {
  const spots = [[.1, .3], [.9, .62], [.08, .86], [.92, .18]];
  return spots.map(([a, b]) => unproject(a * W, b * H)).filter(p => Math.max(Math.abs(p.x), Math.abs(p.y)) > FENCE_R + 2);
}

/* ================= scene: structures ================= */
function shadowBlock(x0, y0, x1, y1, z1, r = .45) {
  for (let x = x0; x <= x1; x += r) for (let y = y0; y <= y1; y += r) for (let z = .3; z < z1; z += r) castShadow(x, y, z, r);
}
function sandbagRing(half, rows) {
  const per = Math.round(half * 8 * 2.6);
  for (let row = 0; row < rows; row++) for (let k = 0; k < per; k++) {
    const t = ((k + row * .5) / per) * 4, side = Math.floor(t) % 4, q = (t % 1) * 2 - 1, r = half;
    const [x, y] = [[r, q * r], [-q * r, r], [-r, -q * r], [q * r, -r]][side];
    sphere(x, y, .17 + row * .3, .21, BAG, 'rough');
    if (row === 0) castShadow(x, y, .2, .22);
  }
}
function ladder(x, y, top) {
  // on the +y wall at x
  for (const o of [-.22, .22]) box(x + o - .035, y + .02, 0, x + o + .035, y + .12, top + .3, METAL, 6);
  for (let z = .28; z < top + .1; z += .28) box(x - .22, y + .05, z, x + .22, y + .11, z + .045, METAL, 7);
  for (let z = .3; z < top; z += .35) castShadow(x, y + .1, z, .16, 1, 0);
}
function buildBunker() {
  const st = G.stage, s = STAGES[st], h = s.half, top = s.roof, dark = rampOf(DARK), steel = rampOf(METAL);
  if (st === 0) {
    // a dugout: two rings of sandbags, a tarp strung over the back half, a crate
    sandbagRing(h, 2);
    for (let a = -h + .1; a <= h - .1; a += STEP) for (let b = -h + .1; b <= 0; b += STEP) {
      plot(a, b, 1.25 + b * .35, rampOf(TARP)[Math.floor((a + 5) * 2.5) % 2 ? 3 : 2]);
    }
    for (const [x, y] of [[-h + .1, -h + .1], [h - .1, -h + .1], [-h + .1, 0], [h - .1, 0]]) box(x - .04, y - .04, 0, x + .04, y + .04, 1.25 + y * .35, WOOD, 3);
    shadowBlock(-h, -h, h, 0, 1.2, .5);
    box(-.9, .25, 0, -.45, .7, .42, PLANK, 4);
    return;
  }
  if (st === 1) {
    // a wooden watch post: plank walls, a flat roof with a rail, a ladder
    box(-h, -h, 0, h, h, top, PLANK, 1);
    const planks = rampOf(PLANK);
    for (let a = -h; a <= h; a += STEP) for (let z = 0; z <= top; z += STEP) {
      if (Math.floor((z + 9) * 5) % 4 === 0) { plot(a, h + .01, z, planks[1]); plot(h + .01, a, z, planks[0]); }
    }
    for (let a = -.3; a <= .3; a += STEP) for (let z = .9; z <= 1.2; z += STEP) plot(h + .02, a - .4, z, dark[0]);
    box(-h - .08, -h - .08, top, h + .08, h + .08, top + .1, WOOD, 2);
    for (const [x, y] of [[-h, -h], [h, -h], [-h, h], [h, h]]) box(x - .05, y - .05, top, x + .05, y + .05, top + .55, WOOD, 3);
    box(-h, h - .04, top + .45, h, h + .04, top + .52, WOOD, 4);
    box(h - .04, -h, top + .45, h + .04, h, top + .52, WOOD, 5);
    box(-h, -h - .04, top + .45, h, -h + .04, top + .52, WOOD, 4);
    box(-h - .04, -h, top + .45, -h + .04, h, top + .52, WOOD, 5);
    ladder(.6, h, top);
    shadowBlock(-h, -h, h, h, top);
    return;
  }
  // concrete from stage 2 on
  sandbagRing(h + .45, st >= 3 ? 2 : 1);
  box(-h, -h, 0, h, h, top, CONCRETE, 1);
  const P = h + .08, T = .2, rim = top + .3;
  box(-P, P - T, top, P, P, rim, CONCRETE, 2);
  box(P - T, -P, top, P, P, rim, CONCRETE, 3);
  box(-P, -P, top, P, -P + T, rim, CONCRETE, 4);
  box(-P, -P, top, -P + T, P, rim, CONCRETE, 5);
  const conc = rampOf(CONCRETE);
  for (let a = -h; a <= h; a += STEP) for (let z = .05; z < top; z += STEP) {
    if (noise(a * 2.2, 1) * 1.6 > (top - z) && hash(a * 90 | 0, z * 90 | 0) > .55) { plot(a, h + .01, z, conc[1]); plot(h + .01, a, z, conc[1]); }
  }
  if (st >= 3) {
    // bolted steel plates over the lower walls
    for (let a = -h; a <= h; a += STEP) for (let z = 0; z <= .9; z += STEP) {
      const m = (a + 9) % .7, seam = m < .03 || z > .86, bolt = Math.abs(m - .35) < .03 && Math.abs(z - .75) < .03;
      const c = bolt ? steel[4] : seam ? steel[1] : steel[2 + (hash(a * 50 | 0, 3) > .7 ? 1 : 0)];
      plot(a, h + .02, z, c); plot(h + .02, a, z, c);
    }
  }
  for (const c of [-1.0, 1.1]) for (let a = -.35; a <= .35; a += STEP) for (let z = 1.25; z <= 1.45; z += STEP) plot(h + .03, c + a, z, dark[0]);
  for (let a = -.35; a <= .35; a += STEP) for (let z = 1.25; z <= 1.45; z += STEP) plot(-.9 + a, h + .03, z, dark[0]);

  for (const r of ['food', 'mineral', 'wood']) G[r] += rateOf(r) * dt;
  G.food -= hired().length * UPKEEP * dt;
  const wasHungry = G.hungry;
  G.hungry = G.food <= 0 && hired().length > 0;
  if (G.food < 0) G.food = 0;
  if (G.hungry && !wasHungry) say('식량이 바닥났다 · 고용한 사람들이 일을 멈춘다', true);
  G.hp = Math.min(stage().hp, G.hp + stage().hp * .015 * dt);
  if (G.fence) {
    const max = FENCES[G.fence].hp, heal = Math.min(max - G.fenceHp, max * .02 * dt);
    G.fenceHp += heal;
    for (let k = 0; k < 4; k++) G.sideDmg[k] = Math.max(0, G.sideDmg[k] - heal / 2);
    if (G.fenceDown && G.fenceHp >= max * .4) { G.fenceDown = false; G.sideDmg = [0, 0, 0, 0]; G.sideStage = [0, 0, 0, 0]; bake(); say('울타리를 다시 세웠다'); sound('hammer'); }
    else if (!G.fenceDown) fenceStages();
  }
  if ((G.spawnIn -= dt) <= 0) {
    if (G.zombies.length < MAX_ZOMBIES) spawn();
    G.spawnIn = spawnEvery(G.wave) * (.6 + Math.random() * .8);
  }
  updateZombies(dt);
  if (G.hp <= 0) fall();
  for (const s of G.shooters) updateShooter(s, dt);
  if (!G.hungry) {
    if (G.build.drill && Math.random() < dt * 8) part(DRILL.x, DRILL.y, .1, (Math.random() - .5) * 2, (Math.random() - .5) * 2, 2, .4, rgb(255, 200, 90), null);
    if (G.build.drill && Math.random() < dt * 2) part(DRILL.x + 1.05, DRILL.y - .1, .8, 0, 0, .8, 1.2, rgb(110, 108, 112), null, 2, 2);
    for (const w of G.workers) {
      const c = Math.sin(G.time * 3.2 + w.phase), prev = Math.sin((G.time - dt) * 3.2 + w.phase);
      if (w.job === '벌목꾼' && prev > -.9 && c <= -.9) { spray(w.x + .55, w.y - .1, .45, 5, 1.2, 2.5, .6, [rgb(214, 176, 120), rgb(150, 106, 66)]); sound('chop'); }
      if (w.job === '농부' && prev > .9 && c <= .9) spray(w.x - .45, w.y, .05, 4, .8, 2, .5, [rampOf(TILLED)[2], rampOf(TILLED)[3]]);
    }
  }
  G.hurt = Math.max(0, G.hurt - dt);
  G.banner = Math.max(0, G.banner - dt);
  for (const t of G.tracers) t.life -= dt;
  G.tracers = G.tracers.filter(t => t.life > 0);
  updateParts(dt);
  for (const d of G.decals) d.life -= dt;
  G.decals = G.decals.filter(d => d.life > 0);
  if (G.statusT > 0 && (G.statusT -= dt) <= 0) nodes.status.textContent = '';
  if ((G.saveIn -= dt) <= 0) { save(); G.saveIn = 5; }
  if (storeOf() !== storeLevel) bake();
}

/* ================= draw ================= */
function line3(a, b, color, color2) {
  const pa = project(...a), pb = project(...b), n = Math.ceil(Math.hypot(pb.sx - pa.sx, pb.sy - pa.sy)), w = px(1);
  for (let k = 0; k <= n; k++) {
    const ix = lerp(pa.sx, pb.sx, k / n) | 0, iy = lerp(pa.sy, pb.sy, k / n) | 0;
    for (let d = 0; d < w; d++) if (ix >= 0 && iy + d >= 0 && ix < W && iy + d < H) pix[(iy + d) * W + ix] = d ? color2 : color;
  }
}
function drawBars() {
  const green = rgb(120, 196, 88), red = rgb(220, 80, 60), empty = rgb(70, 66, 64), t = px(1);
  for (const z of G.zombies) {
    if (z.state === 'dying' || z.hp >= z.max) continue;
    const p = project(z.x, z.y, 2.05 * z.scale), w = Math.round((z.brute ? 1 : .6) * S), left = Math.round(p.sx - w / 2), top = Math.round(p.sy) - 3 * t;
    const fill = Math.ceil(w * clamp(z.hp / z.max, 0, 1));
    for (let k = -t; k < w + t; k++) for (let r = -t; r < 2 * t; r++) {
      const ix = left + k, iy = top + r;
      if (ix < 0 || iy < 0 || ix >= W || iy >= H) continue;
      pix[iy * W + ix] = r >= 0 && r < t && k >= 0 && k < w ? (k < fill ? (z.brute ? red : green) : empty) : INK;
    }
  }
}
function drawAmmo(s) {
  if (!s.hero) return;
  const p = project(s.x, s.y, s.z + 1.95), mag = gunStat('mag'), cx = Math.round(p.sx), top = Math.round(p.sy), t = px(1);
  const put = (ix, iy, c) => { for (let a = 0; a < t; a++) for (let b = 0; b < t; b++) { const x = ix + a, y = iy + b; if (x >= 0 && y >= 0 && x < W && y < H) pix[y * W + x] = c; } };
  if (s.reload > 0) {
    const w = 16, left = cx - (w * t) / 2, fill = Math.round(w * (1 - s.reload / s.reloadLen));
    for (let x = -1; x <= w; x++) for (let y = -1; y <= 2; y++) put(left + x * t, top + y * t, x < 0 || x >= w || y < 0 || y > 1 ? INK : x < fill ? SIGNAL : rgb(70, 66, 64));
    return;
  }
  const shown = Math.min(mag, 15), left = cx - shown * t;
  for (let k = 0; k < shown; k++) {
    const full = k < Math.ceil(s.ammo * shown / mag);
    for (let y = -1; y <= 3; y++) put(left + k * 2 * t, top + y * t, y < 0 || y > 2 ? PAPER : full ? (y === 0 ? rgb(232, 184, 74) : SIGNAL) : rgb(150, 146, 140));
  }
}
function draw() {
  pix.set(bakedPix);
  zb.set(bakedZ);
  pendingShadows.length = 0;
  const windT = STILL || !settings.wind ? 0 : Math.floor(G.time * WIND_FPS) / WIND_FPS;
  for (const d of G.decals) for (const i of d.pts) {
    if (d.life < 2 && hash(i, 7) > d.life / 2) continue;
    if (zb[i] === groundZ[i]) pix[i] = d.color;
  }
  drawDrillMotion(G.hungry ? 0 : G.time);
  for (const w of G.workers) drawWorker(w, G.hungry ? 0 : G.time);
  for (const s of G.shooters) drawShooter(s);
  for (const z of G.zombies) drawZombie(z);
  drawLeaves(windT);
  drawTufts(windT);
  flushShadows();
  applyShadows(groundZ);
  shadeEdges();
  for (const t of G.tracers) line3(t.a, t.b, SIGNAL, rgb(255, 250, 220));
  drawParts();
  for (const z of G.zombies) drawFace(z);
  drawBars();
  for (const s of G.shooters) drawAmmo(s);
  const shake = G.hurt > .2 ? (Math.floor(G.time * 40) % 2 ? 1 : -1) * px(1) : 0;
  ctx.putImageData(image, shake, 0);
  // numbers on top as text: damage, rewards, the wave banner
  ctx.textAlign = 'center';
  ctx.lineJoin = 'round';
  for (const f of G.floats) {
    const p = project(f.x, f.y, f.z), size = Math.round(S * .42 * f.size);
    ctx.font = `bold ${size}px ui-monospace, Menlo, Consolas, monospace`;
    ctx.globalAlpha = clamp(f.life * 2.5, 0, 1);
    ctx.lineWidth = Math.max(2, size / 4);
    ctx.strokeStyle = '#1c1b19'; ctx.strokeText(f.text, p.sx, p.sy);
    ctx.fillStyle = f.color; ctx.fillText(f.text, p.sx, p.sy);
  }
  ctx.globalAlpha = 1;
  if (G.banner > 0) {
    const size = Math.round(S * .9);
    ctx.font = `bold ${size}px ui-monospace, Menlo, Consolas, monospace`;
    ctx.globalAlpha = clamp(G.banner, 0, 1);
    ctx.lineWidth = size / 5;
    ctx.strokeStyle = '#1c1b19'; ctx.strokeText('웨이브 ' + G.wave, W / 2, H * .22);
    ctx.fillStyle = '#ffd84a'; ctx.fillText('웨이브 ' + G.wave, W / 2, H * .22);
    ctx.globalAlpha = 1;
  }
}

function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch { d = null; }
  if (d && d.lv) {
    for (const k of ['money', 'food', 'mineral', 'wood', 'waveKills', 'totalKills']) G[k] = +d[k] || 0;
    G.wave = Math.max(1, +d.wave || 1);
    for (const k of Object.keys(G.lv)) G.lv[k] = +d.lv[k] || 0;
    for (const k of Object.keys(G.build)) G.build[k] = +(d.build || {})[k] || 0;
    G.stage = clamp(+d.stage || 0, 0, STAGES.length - 1);
    G.fence = clamp(+d.fence || 0, 0, FENCES.length - 1);
    if (Array.isArray(d.crew)) G.crew = [0, 1, 2, 3, 4].map(i => d.crew[i] && JOBS.includes(d.crew[i].job) ? { job: d.crew[i].job } : null);
    // what the yard made while nobody was looking
    const away = clamp((Date.now() - (+d.at || Date.now())) / 1000, 0, OFFLINE_CAP);
    if (away > 30) {
      const gains = {};
      for (const r of ['food', 'mineral', 'wood']) gains[r] = rateOf(r) * away;
      gains.food -= hired().length * UPKEEP * away;
      for (const r of Object.keys(gains)) G[r] = Math.max(0, G[r] + gains[r]);
      const text = ['food', 'mineral', 'wood'].filter(r => gains[r] > 1).map(r => RES_NAME[r] + ' +' + fmt(gains[r])).join(', ');
      if (text) say('자리 비운 동안 ' + text);
    }
  }
  G.hp = stage().hp;
  G.fenceHp = FENCES[G.fence].hp;
}

let audio = null, noiseBuffer = null, master = null, lastShot = 0;
function ensureAudio() {
  if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audio = new AC();
  master = audio.createGain();
  master.connect(audio.destination);
  noiseBuffer = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
}

  const now = audio.currentTime + delay, src = audio.createBufferSource(), filter = audio.createBiquadFilter(), gain = audio.createGain();
  src.buffer = noiseBuffer;
  filter.type = type; filter.frequency.value = freq; filter.Q.value = .8;
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(.0005, now + length);
  src.connect(filter).connect(gain).connect(master);
  src.start(now, Math.random() * .5, length + .02);
}
function sound(kind) {
  if (!audio || !settings.sound || document.hidden) return;
  master.gain.value = settings.volume;
  if (kind === 'shot') {
    if (audio.currentTime - lastShot < .07) return;
    lastShot = audio.currentTime;
    burst('bandpass', 1500, .06, .07); burst('lowpass', 300, .05, .08);
  }
  if (kind === 'kill') burst('lowpass', 320, .09, .14);
  if (kind === 'buy') burst('bandpass', 2400, .06, .08);
  if (kind === 'crash') { burst('lowpass', 160, .3, .6); burst('bandpass', 700, .12, .4, .05); }
  if (kind === 'thud') burst('lowpass', 240, .08, .1);
  if (kind === 'clang') burst('bandpass', 2600, .05, .12);
  if (kind === 'magout') burst('highpass', 3000, .04, .03);
  if (kind === 'magin') burst('bandpass', 1800, .07, .04);
  if (kind === 'rack') { burst('highpass', 2500, .06, .03); burst('highpass', 2200, .06, .03, .07); }
  if (kind === 'hammer') for (let k = 0; k < 3; k++) burst('bandpass', 900, .08, .05, k * .15);
  if (kind === 'chop') burst('bandpass', 700, .04, .05);
}

/* ================= boot ================= */
load();
bakeGround();
bake();
growGrass();
syncShooters();
syncWorkers();
renderPanel(true);
refreshTop();
addEventListener('resize', fitStage);
fitStage();
if (!nodes.status.textContent) say('화면 밖에서 좀비가 몰려온다 · 좀비를 누르면 직접 쏜다');
let last = performance.now(), hudIn = 0;
function frame(now) {
  // a background tab gets its time back in chunks, so the yard keeps working while hidden
  let dt = Math.min(5, (now - last) / 1000) * G.speed;
  last = now;
  while (dt > 0) { const step = Math.min(.04, dt); update(step); dt -= step; }
  draw();
  if (--hudIn <= 0) { hudIn = 6; refreshTop(); renderPanel(false); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__bunker = { G, step(dt, noDraw) { update(dt); if (!noDraw) draw(); }, act, refreshTop, renderPanel, syncShooters, syncWorkers, bake };
</script>
