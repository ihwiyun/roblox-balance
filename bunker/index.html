<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>벙커 – 좀비 방치형</title>
<style>
  /* the pixel-plays look: a picture on white paper, small monospace text, thin ink lines */
  :root { --ink: #1c1b19; --muted: #8b877f; --paper: #fff; --line: #e4e0d8; --soft: #f6f4ef; --bad: #c0392b; --good: #2f7d32; --top: 44px; --bottom: 252px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 13px/1.4 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }
  canvas.ico { image-rendering: pixelated; flex: none; display: block; }

  /* top: one thin line, no bar */
  #top { position: fixed; top: 0; left: 0; right: 0; height: var(--top); padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left)); display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; z-index: 3; pointer-events: none; }
  #res { display: flex; flex-wrap: wrap; gap: 0 12px; align-items: center; min-width: 0; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rate { color: var(--muted); font-weight: 400; font-size: 11px; }
  .rate.neg { color: var(--bad); }
  #waveLine { flex-basis: 100%; color: var(--muted); font-size: 12px; }
  #topBtns { display: flex; flex: none; pointer-events: auto; }
  .tbtn { background: none; border: 0; color: var(--muted); padding: 6px 7px; cursor: pointer; white-space: nowrap; }
  .tbtn:hover, .tbtn[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  #stage { position: fixed; left: 0; right: 0; top: var(--top); bottom: var(--bottom); display: grid; place-items: center; overflow: hidden; }
  canvas#c { display: block; image-rendering: pixelated; touch-action: manipulation; cursor: crosshair; outline: none; }
  #hp { position: fixed; left: max(8px, env(safe-area-inset-left)); bottom: calc(var(--bottom) + 6px); background: rgba(255, 255, 255, .92); border: 1px solid var(--ink); padding: 5px 7px; display: grid; grid-template-columns: auto 72px; gap: 4px 8px; align-items: center; pointer-events: none; font-size: 11px; }
  #hp .lbl { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .track { height: 7px; border: 1px solid var(--ink); background: #fff; }
  .fill { height: 100%; background: #6aa64a; width: 0; }
  #fenceFill { background: #a0784a; }
  .hurt .fill { background: #d0503c; }
  #status { position: fixed; left: 0; right: 0; top: calc(var(--top) + 2px); text-align: center; pointer-events: none; color: var(--muted); padding: 0 12px; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; z-index: 2; }
  #status.alert { color: var(--bad); font-weight: 700; }

  /* bottom: a list of rows, then the tab bar */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; height: var(--bottom); border-top: 1px solid var(--ink); background: var(--paper); display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
  #panel { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); align-content: start; }
  #tabs { display: grid; grid-template-columns: repeat(4, 1fr); flex: none; border-top: 1px solid var(--ink); }
  .tab { background: var(--paper); border: 0; padding: 6px 2px 7px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 700; box-shadow: inset 0 2px 0 var(--ink); }
  .card { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .card .icon { grid-row: span 2; width: 34px; height: 34px; display: grid; place-items: center; background: var(--soft); border: 1px solid var(--line); align-self: start; }
  .card .body { min-width: 0; }
  .card .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .card .name { font-weight: 700; }
  .card .lv { color: var(--muted); }
  .card .desc { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .buy { min-width: 76px; display: flex; flex-direction: column; align-items: center; gap: 0; background: var(--paper); border: 1px solid var(--ink); padding: 5px 8px; cursor: pointer; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 12px; }
  .buy:hover:not([disabled]) { background: var(--ink); color: #fff; }
  .buy:active:not([disabled]) { transform: translateY(1px); }
  .buy[disabled] { border-color: var(--line); color: #b3afa7; cursor: default; }
  .buy .short { color: var(--bad); }
  .row { grid-column: 2 / -1; display: flex; gap: 4px; flex-wrap: wrap; }
  .mini { background: var(--paper); border: 1px solid var(--line); padding: 4px 9px; cursor: pointer; font-size: 12px; }
  .mini[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  dialog { border: 1px solid var(--ink); padding: 16px; width: min(320px, calc(100vw - 32px)); font: inherit; color: var(--ink); background: var(--paper); }
  dialog::backdrop { background: rgba(255, 255, 255, .75); }
  dialog h2 { margin: 0 0 12px; font-size: 14px; }
  .set { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .set input[type=range] { width: 130px; accent-color: var(--ink); }
  .danger { color: var(--bad); border-color: var(--bad); }
  @media (max-width: 440px) { :root { --top: 68px; --bottom: 262px; } #panel { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="top">
  <div id="res">
    <span class="chip" data-ico="coin"><span id="r-money">0</span></span>

</div>
<div id="stage"><canvas id="c" tabindex="0" aria-label="벙커 주변 들판. 화면 밖에서 좀비가 몰려온다. 좀비를 누르면 직접 쏜다."></canvas></div>
<div id="status" role="status" aria-live="polite"></div>
<div id="hp">
  <span class="lbl" id="bunkerText">벙커</span><div class="track" id="bunkerTrack"><div class="fill" id="bunkerFill"></div></div>
  <span class="lbl" id="fenceText">울타리 없음</span><div class="track"><div class="fill" id="fenceFill"></div></div>
</div>
<div id="bottom">
  <div id="panel"></div>
  <div id="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="gun" data-ico="bullet" aria-selected="true">무기</button>
    <button class="tab" role="tab" data-tab="def" data-ico="bunker" aria-selected="false">방어</button>
    <button class="tab" role="tab" data-tab="under" data-ico="drill" aria-selected="false">지하</button>

  </div>
</div>
<dialog id="settings">
  <h2>설정</h2>
  <div class="set"><span>효과음</span><button class="mini" id="soundToggle" type="button">켜짐</button></div>
  <div class="set"><span>음량</span><input type="range" id="volume" min="0" max="100" value="70"></div>
  <div class="set"><span>풀 흔들림</span><button class="mini" id="windToggle" type="button">켜짐</button></div>
  <div class="set"><span>진행 초기화</span><button class="mini danger" id="resetBtn" type="button">초기화</button></div>
  <form method="dialog" style="text-align:right;margin-top:12px"><button class="mini">닫기</button></form>
</dialog>
<script>
// size the game canvas to the stage: every game pixel is a whole number of device pixels,
// and the world scale is chosen so the fenced yard fits with room around it
(() => {
  const r = document.getElementById('stage').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const pick = k => {
    const width = Math.min(1600, Math.floor(r.width * dpr / k)), height = Math.min(900, Math.floor(r.height * dpr / k));
    return { k, width, height, scale: Math.min(44, width / 16.5, height / 11.5) };
  };
  let best = pick(1);
  for (let k = 2; k <= 6; k++) { const c = pick(k); if (c.scale >= 28) best = c; }
  window.PP_SCENE = { width: best.width, height: best.height, scale: best.scale, originY: best.scale * .9, grassDensity: .07 };
})();
</script>
<script src="engine.js"></script>
<script>
'use strict';
/* ================= numbers ================= */
const FENCE_R = 5.2, MAX_ZOMBIES = 40, OFFLINE_CAP = 2 * 3600, SAVE_KEY = 'bunker-idle:v2';
const STAGES = [
  { name: '간이 참호', half: 1.25, roof: .32, hp: 150, cost: null },
  { name: '나무 초소', half: 1.45, roof: 1.7, hp: 400, cost: { money: 80, wood: 30 } },
  { name: '콘크리트 벙커', half: 1.9, roof: 2.1, hp: 1000, cost: { money: 400, wood: 120, mineral: 40 } },
  { name: '강화 벙커', half: 2.05, roof: 2.3, hp: 2500, cost: { money: 2500, wood: 300, mineral: 250 } },
  { name: '요새', half: 2.3, roof: 2.6, hp: 6000, cost: { money: 15000, wood: 800, mineral: 1200 } },
];
const FENCES = [
  { name: '없음', hp: 0 },
  { name: '나무 말뚝', hp: 120, cost: { wood: 15 } },
  { name: '나무 울타리', hp: 300, cost: { money: 40, wood: 50 } },
  { name: '통나무 목책', hp: 700, cost: { money: 200, wood: 150 } },
  { name: '철조망', hp: 1500, cost: { money: 600, wood: 100, mineral: 80 } },
  { name: '철판 벽', hp: 3500, cost: { money: 2000, mineral: 300 } },
  { name: '콘크리트 벽', hp: 8000, cost: { money: 8000, wood: 500, mineral: 1000 } },
];
const BUILD = {
  farm:  { name: '수경 농장', res: 'food', max: 20, rate: L => L ? .3 * L * 1.12 ** L : 0, cost: L => ({ money: Math.ceil(25 * 1.55 ** L) }) },
  saw:   { name: '뿌리 채굴장', res: 'wood', max: 20, rate: L => L ? .35 * L * 1.12 ** L : 0, cost: L => ({ money: Math.ceil(30 * 1.55 ** L) }) },
  drill: { name: '광산 드릴', res: 'mineral', max: 20, rate: L => L ? .2 * L * 1.12 ** L : 0, cost: L => ({ money: Math.ceil(80 * 1.6 ** L), wood: Math.ceil(15 * 1.5 ** L) }) },
};
const GUN = {
  atk: { name: '공격력', max: 60, cost: L => Math.ceil(15 * 1.45 ** L), val: L => 10 * (1 + .5 * L) * 1.05 ** L },
  spd: { name: '연사', max: 25, cost: L => Math.ceil(20 * 1.5 ** L), val: L => 1 + .12 * L },
  mag: { name: '탄창', max: 25, cost: L => Math.ceil(15 * 1.4 ** L), val: L => 5 + L },
};
const reloadTime = () => 1.6 * .97 ** G.lv.mag;
const JOBS = ['사수', '농부', '목재공', '광부'];
const JOB_RES = { 농부: 'food', 광부: 'mineral', 목재공: 'wood' };
const UPKEEP = .1; // food per second per hired survivor
const hireCost = n => ({ money: Math.ceil(60 * 2.5 ** n), food: 20 + 20 * n });
const zombieHp = w => 25 * 1.16 ** (w - 1);
const zombieHit = w => 4 * 1.12 ** (w - 1);
const zombieReward = w => 6 * 1.14 ** (w - 1);
const killsNeeded = w => 8 + 2 * w;
const spawnEvery = w => Math.max(.35, 3 * .94 ** (w - 1));
const NAMES = ['민준', '서연', '도윤', '하은', '지호'];

/* ================= state ================= */
const G = {
  money: 0, food: 0, mineral: 0, wood: 0,
  lv: { atk: 0, spd: 0, mag: 0 }, stage: 0, fence: 0, build: { farm: 0, saw: 0, drill: 0 },
  crew: [null, null, null, null, null],
  wave: 1, waveKills: 0, totalKills: 0,
  hp: 150, fenceHp: 0, fenceDown: false, sideDmg: [0, 0, 0, 0], sideStage: [0, 0, 0, 0],
  zombies: [], tracers: [], parts: [], uparts: [], decals: [], floats: [], shooters: [], workers: [], view: 'yard',
  time: 0, spawnIn: 2, speed: 1, hurt: 0, banner: 0, hungry: false, saveIn: 5, statusT: 0,
};
const stage = () => STAGES[G.stage];
const gunStat = k => GUN[k].val(G.lv[k]);
const hired = () => G.crew.filter(Boolean);
const jobCount = j => G.crew.filter(c => c && c.job === j).length;
const slotsOpen = () => G.stage + 1;
function rateOf(res) {
  // a building's output, boosted by workers on that job; hands without a building still gather a little
  const key = Object.keys(BUILD).find(k => BUILD[k].res === res), L = G.build[key];
  const job = Object.keys(JOB_RES).find(j => JOB_RES[j] === res), n = jobCount(job);
  return (G.hungry ? BUILD[key].rate(L) : BUILD[key].rate(L) * (1 + .5 * n) + n * .15);
}
function fmt(n) {
  n = Math.max(0, n);
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n) + '';
  const units = ['K', 'M', 'B', 'T', 'aa', 'ab', 'ac'];
  let i = -1;
  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
  return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + units[i];
}
const RES_NAME = { money: '$', food: '식량', mineral: '광물', wood: '나무' };
const canPay = c => Object.entries(c).every(([k, v]) => G[k] >= v);
function pay(c) { for (const [k, v] of Object.entries(c)) G[k] -= v; }

/* ================= palette ================= */
const CONCRETE = [176, 172, 160], BAG = [190, 166, 116], WOOD = [150, 106, 66], PLANK = [176, 132, 84], METAL = [148, 158, 166], DARK = [44, 40, 50];
const DIRT = [152, 120, 84], TILLED = [118, 84, 58], CROP = [104, 152, 66], ROCK = [132, 130, 128], ORE = [104, 140, 196], TARP = [96, 116, 82];
const STEP = .45 / S, OLIVE_C = [104, 116, 78];
const px = n => Math.max(1, Math.round(n * S / 16)); // sizes that follow the pixel grid

/* ================= scene: ground ================= */
const KIND_DIRT = 1;
function groundColor(x, y, ix, iy) {
  const clearing = Math.hypot(x, y) + noise(x * .6, y * .6) * 1.6;
  const patch = noise(x * .18 + 7, y * .18) > .72;
  if (clearing < FENCE_R - .4 || patch) {
    const ramp = rampOf(DIRT), fine = hash(ix, iy);
    if (fine > .985) return [ramp[4], KIND_DIRT];
    if (fine < .01) return [ramp[0], KIND_DIRT];
    return [ramp[clamp(Math.floor(2.1 + noise(x * 1.4, y * 1.4) * 1.3 + (bayerAt(ix, iy) - .5) * .5), 1, 4)], KIND_DIRT];
  }
  const tone = noise(x * .25, y * .25) * 1.5 + noise(x * 1.1 + 4, y * 1.1) * .7;
  return [tuftLit[clamp(Math.floor(1 + tone + (bayerAt(ix, iy) - .5) * .5), 0, 4)], KIND_GRASS];
}
const groundPix = new Uint32Array(W * H), groundKinds = new Uint8Array(W * H), groundDepth = new Float32Array(W * H), groundMask = new Uint8Array(W * H);
function bakeGround() {
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const g = unproject(ix + .5, iy + .5), [c, kind] = groundColor(g.x, g.y, ix, iy), i = iy * W + ix;
    // the picture dissolves into the white page at its edges, like a diorama on paper
    const edge = Math.min(ix, W - 1 - ix, iy, H - 1 - iy) / (S * .9) + (noise(ix * .05, iy * .05) - .5) * .5;
    if (edge < 1 && bayerAt(ix, iy) * .9 + hash(ix, iy) * .3 > edge) { groundPix[i] = rgb(255, 255, 255); groundKinds[i] = 0; groundMask[i] = 0; groundDepth[i] = (g.x + g.y) / R2 * COS; continue; }
    groundMask[i] = 1;
    groundPix[i] = c; groundKinds[i] = kind;
    groundDepth[i] = (g.x + g.y) / R2 * COS;
  }
}
/* ================= scene: structures ================= */
function shadowBlock(x0, y0, x1, y1, z1, r = .45) {
  for (let x = x0; x <= x1; x += r) for (let y = y0; y <= y1; y += r) for (let z = .3; z < z1; z += r) castShadow(x, y, z, r);
}
function sandbagRing(half, rows) {
  const per = Math.round(half * 8 * 2.6);
  for (let row = 0; row < rows; row++) for (let k = 0; k < per; k++) {
    const t = ((k + row * .5) / per) * 4, side = Math.floor(t) % 4, q = (t % 1) * 2 - 1, r = half;
    const [x, y] = [[r, q * r], [-q * r, r], [-r, -q * r], [q * r, -r]][side];
    sphere(x, y, .17 + row * .3, .21, BAG, 'rough');
    if (row === 0) castShadow(x, y, .2, .22);
  }
}
function ladder(x, y, top) {
  // on the +y wall at x
  for (const o of [-.22, .22]) box(x + o - .035, y + .02, 0, x + o + .035, y + .12, top + .3, METAL, 6);
  for (let z = .28; z < top + .1; z += .28) box(x - .22, y + .05, z, x + .22, y + .11, z + .045, METAL, 7);
  for (let z = .3; z < top; z += .35) castShadow(x, y + .1, z, .16, 1, 0);
}
function buildBunker() {
  const st = G.stage, s = STAGES[st], h = s.half, top = s.roof, dark = rampOf(DARK), steel = rampOf(METAL);
  if (st === 0) {
    // a foxhole: two rings of sandbags, a plank platform in the middle to see over them on every side, ammo crates
    sandbagRing(h, 2);
    box(-.55, -.55, 0, .55, .55, top, PLANK, 3);
    const planks = rampOf(PLANK);
    for (let a = -.55; a <= .55; a += STEP) for (let b = -.55; b <= .55; b += STEP) if (Math.floor((a + 5) * 6) % 3 === 0) plot(a, b, top + .005, planks[2]);
    box(-1.0, .55, 0, -.6, .95, .32, OLIVE_C, 4);
    box(.6, -1.0, 0, 1.0, -.6, .32, OLIVE_C, 5);
    shadowBlock(-.55, -.55, .55, .55, top, .3);
    return;
  }
  if (st === 1) {
    // a wooden watch post: plank walls, a flat roof with a rail, a ladder
    box(-h, -h, 0, h, h, top, PLANK, 1);
    const planks = rampOf(PLANK);
    for (let a = -h; a <= h; a += STEP) for (let z = 0; z <= top; z += STEP) {
      if (Math.floor((z + 9) * 5) % 4 === 0) { plot(a, h + .01, z, planks[1]); plot(h + .01, a, z, planks[0]); }
    }
    for (let a = -.3; a <= .3; a += STEP) for (let z = .9; z <= 1.2; z += STEP) plot(h + .02, a - .4, z, dark[0]);
    box(-h - .08, -h - .08, top, h + .08, h + .08, top + .1, WOOD, 2);
    for (const [x, y] of [[-h, -h], [h, -h], [-h, h], [h, h]]) box(x - .05, y - .05, top, x + .05, y + .05, top + .55, WOOD, 3);
    box(-h, h - .04, top + .45, h, h + .04, top + .52, WOOD, 4);
    box(h - .04, -h, top + .45, h + .04, h, top + .52, WOOD, 5);
    box(-h, -h - .04, top + .45, h, -h + .04, top + .52, WOOD, 4);
    box(-h - .04, -h, top + .45, -h + .04, h, top + .52, WOOD, 5);
    ladder(.6, h, top);
    shadowBlock(-h, -h, h, h, top);
    return;
  }
  // concrete from stage 2 on
  sandbagRing(h + .45, st >= 3 ? 2 : 1);
  box(-h, -h, 0, h, h, top, CONCRETE, 1);
  const P = h + .08, T = .2, rim = top + .3;
  box(-P, P - T, top, P, P, rim, CONCRETE, 2);
  box(P - T, -P, top, P, P, rim, CONCRETE, 3);
  box(-P, -P, top, P, -P + T, rim, CONCRETE, 4);
  box(-P, -P, top, -P + T, P, rim, CONCRETE, 5);
  const conc = rampOf(CONCRETE);
  for (let a = -h; a <= h; a += STEP) for (let z = .05; z < top; z += STEP) {
    if (noise(a * 2.2, 1) * 1.6 > (top - z) && hash(a * 90 | 0, z * 90 | 0) > .55) { plot(a, h + .01, z, conc[1]); plot(h + .01, a, z, conc[1]); }
  }
  if (st >= 3) {
    // bolted steel plates over the lower walls
    for (let a = -h; a <= h; a += STEP) for (let z = 0; z <= .9; z += STEP) {
      const m = (a + 9) % .7, seam = m < .03 || z > .86, bolt = Math.abs(m - .35) < .03 && Math.abs(z - .75) < .03;
      const c = bolt ? steel[4] : seam ? steel[1] : steel[2 + (hash(a * 50 | 0, 3) > .7 ? 1 : 0)];

/* ================= loop ================= */
function say(text, alert) {

}
function update(dt) {

  G.food -= hired().length * UPKEEP * dt;
  const wasHungry = G.hungry;
  G.hungry = G.food <= 0 && hired().length > 0;
  if (G.food < 0) G.food = 0;
  if (G.hungry && !wasHungry) say('식량이 바닥났다 · 고용한 사람들이 일을 멈춘다', true);
  G.hp = Math.min(stage().hp, G.hp + stage().hp * .015 * dt);
  if (G.fence) {
    const max = FENCES[G.fence].hp, heal = Math.min(max - G.fenceHp, max * .02 * dt);
    G.fenceHp += heal;
    for (let k = 0; k < 4; k++) G.sideDmg[k] = Math.max(0, G.sideDmg[k] - heal / 2);
    if (G.fenceDown && G.fenceHp >= max * .4) { G.fenceDown = false; G.sideDmg = [0, 0, 0, 0]; G.sideStage = [0, 0, 0, 0]; bakeYard(); say('울타리를 다시 세웠다'); sound('hammer'); }
    else if (!G.fenceDown) fenceStages();
  }
  if ((G.spawnIn -= dt) <= 0) {
    if (G.zombies.length < MAX_ZOMBIES) spawn();
    G.spawnIn = spawnEvery(G.wave) * (.6 + Math.random() * .8);
  }
  updateZombies(dt);
  if (G.hp <= 0) fall();
  for (const s of G.shooters) updateShooter(s, dt);
  if (!G.hungry) inDugout(() => {
    if (G.build.drill) {
      if (Math.random() < dt * 9) part(PIT.x, PIT.y, .05, (Math.random() - .5) * 2.4, (Math.random() - .5) * 2.4, 2.2, .45, rgb(255, 204, 96), null);
      if (Math.random() < dt * 2) part(PIT.x + 1.25, PIT.y - 1.05, .8, (Math.random() - .5) * .3, 0, 1, 1.4, rgb(120, 116, 120), null, 2, 2);
    }
    for (const w of G.workers) {
      if (w.job === '목재공') {
        const ph = (G.time * .9 + w.phase) % 1, prev = ((G.time - dt) * .9 + w.phase) % 1;

      if (w.job === '광부') {
        const ph = (G.time * .9 + w.phase) % 1, prev = ((G.time - dt) * .9 + w.phase) % 1;

          spray(w.x + .05, UG.y0 + .1, .95, 7, 1.6, 2.2, .7, [rgb(110, 150, 214), rgb(150, 146, 140), rgb(255, 214, 120)]);
          if (G.view === 'under') sound('clang');
        }

      if (w.job === '농부' && Math.random() < dt * 1.5) part(w.x + (Math.random() - .5) * .6, w.y - .8, 1.2 + Math.random() * .4, 0, 0, -.2, .8, rgb(140, 210, 110), null);
    }

  G.banner = Math.max(0, G.banner - dt);
  for (const t of G.tracers) t.life -= dt;
  G.tracers = G.tracers.filter(t => t.life > 0);

  for (const d of G.decals) d.life -= dt;

}

function line3(a, b, color, color2) {

  for (let k = 0; k <= n; k++) {
    const ix = lerp(pa.sx, pb.sx, k / n) | 0, iy = lerp(pa.sy, pb.sy, k / n) | 0;
    for (let d = 0; d < w; d++) if (ix >= 0 && iy + d >= 0 && ix < W && iy + d < H) pix[(iy + d) * W + ix] = d ? color2 : color;
  }
}
function drawBars() {

    if (z.state === 'dying' || z.hp >= z.max) continue;
    const p = project(z.x, z.y, 2.05 * z.scale), w = Math.round((z.brute ? 1 : .6) * S), left = Math.round(p.sx - w / 2), top = Math.round(p.sy) - 3 * t;
    const fill = Math.ceil(w * clamp(z.hp / z.max, 0, 1));
    for (let k = -t; k < w + t; k++) for (let r = -t; r < 2 * t; r++) {
      const ix = left + k, iy = top + r;
      if (ix < 0 || iy < 0 || ix >= W || iy >= H) continue;

function drawAmmo(s) {

  if (s.reload > 0) {

    for (let x = -1; x <= w; x++) for (let y = -1; y <= 2; y++) put(left + x * t, top + y * t, x < 0 || x >= w || y < 0 || y > 1 ? INK : x < fill ? SIGNAL : rgb(70, 66, 64));

  }
  const shown = Math.min(mag, 15), left = cx - shown * t;
  for (let k = 0; k < shown; k++) {
    const full = k < Math.ceil(s.ammo * shown / mag);
    for (let y = -1; y <= 3; y++) put(left + k * 2 * t, top + y * t, y < 0 || y > 2 ? PAPER : full ? (y === 0 ? rgb(232, 184, 74) : SIGNAL) : rgb(150, 146, 140));

}));
nodes.viewBtn.addEventListener('click', () => setView(G.view === 'under' ? 'yard' : 'under'));
const costHtml = c => Object.entries(c).map(([k, v]) => `<span class="${G[k] < v ? 'short' : ''}">${k === 'money' ? '$' + fmt(v) : RES_NAME[k] + ' ' + fmt(v)}</span>`).join('');
const shotsToKill = dmg => Math.ceil(zombieHp(G.wave) / dmg - 1e-9);
function cards() {
  if (tab === 'gun') {
    return Object.entries(GUN).map(([k, g]) => {
      const L = G.lv[k], max = L >= g.max, now = g.val(L), next = g.val(L + 1);
      let desc;
      if (k === 'atk') desc = `한 발 ${fmt(now)} → ${fmt(next)}<br>지금 좀비 ${shotsToKill(now)}발 → ${shotsToKill(next)}발`;
      else if (k === 'spd') desc = `초당 ${now.toFixed(2)}발 → ${next.toFixed(2)}발`;
      else desc = `${now}발 → ${next}발 · 장전 ${reloadTime().toFixed(1)}초`;
      return { id: 'gun:' + k, ico: { atk: 'bullet', spd: 'fire', mag: 'mag' }[k], name: g.name, lv: 'Lv ' + L, desc: max ? '최대 레벨' : desc, cost: max ? null : { money: g.cost(L) }, max };
    });
  }
  if (tab === 'def') {
    const s = G.stage, nextS = STAGES[s + 1], f = G.fence, nextF = FENCES[f + 1];
    return [
      { id: 'stage', ico: 'bunker', name: '벙커 · ' + STAGES[s].name, lv: (s + 1) + '단계', desc: nextS ? `다음: ${nextS.name}<br>체력 ${fmt(STAGES[s].hp)} → ${fmt(nextS.hp)} · 인원 슬롯 +1` : '최대 단계', cost: nextS ? nextS.cost : null, max: !nextS },
      { id: 'fence', ico: 'fence', name: '울타리 · ' + FENCES[f].name, lv: f + '단계', desc: nextF ? `다음: ${nextF.name}<br>체력 ${fmt(nextF.hp)}` : '최대 단계', cost: nextF ? nextF.cost : null, max: !nextF },
    ];
  }
  if (tab === 'under') {
    return Object.entries(BUILD).map(([k, b]) => {
      const L = G.build[k], max = L >= b.max, job = Object.keys(JOB_RES).find(j => JOB_RES[j] === b.res);
      return { id: 'build:' + k, ico: { farm: 'farm', saw: 'log', drill: 'drill' }[k], name: b.name, lv: L ? 'Lv ' + L : '미개척', desc: max ? '최대 레벨' : `${RES_NAME[b.res]} 초당 ${fmt(b.rate(L))} → ${fmt(b.rate(L + 1))}<br>${job} 1명당 +50%`, cost: max ? null : b.cost(L), max };
    });
  }
  return G.crew.map((c, i) => {
    if (i >= slotsOpen()) return { id: 'slot:' + i, ico: 'lock', name: '슬롯 ' + (i + 1), lv: '잠김', desc: `벙커 ${i + 1}단계(${STAGES[i].name})에서 열림`, locked: true };
    if (!c) return { id: 'hire:' + i, ico: 'person', name: '슬롯 ' + (i + 1), lv: '빈 자리', desc: `생존자 고용 · 식량을 초당 ${UPKEEP}씩 먹는다`, cost: hireCost(hired().length) };
    const job = c.job, what = job === '사수' ? '지붕에서 함께 쏜다 (피해 60%)' : `지하에서 ${RES_NAME[JOB_RES[job]]} 생산 +50%`;
    return { id: 'job:' + i, ico: 'person', name: NAMES[i], lv: job, desc: what + (G.hungry ? ' · 배고파서 쉬는 중' : ''), jobs: true, slot: i };
  });
}
let panelKey = '';
function renderPanel(force) {
  const list = cards();
  const key = tab + JSON.stringify(list.map(c => [c.id, c.name, c.lv, c.desc, c.cost && Object.entries(c.cost).map(([k, v]) => [v, G[k] >= v])]));
  if (!force && key === panelKey) return;
  panelKey = key;
  nodes.panel.innerHTML = '';
  for (const c of list) {
    const el = document.createElement('div');
    el.className = 'card';
    const ic = document.createElement('div');
    ic.className = 'icon'; ic.append(icon(c.ico, 2.6));
    el.append(ic);
    el.insertAdjacentHTML('beforeend', `<div class="body"><div class="head"><span class="name">${c.name}</span><span class="lv">${c.lv}</span></div><div class="desc">${c.desc}</div></div>`);
    if (c.locked) el.append(document.createElement('span'));
    if (c.jobs) {
      const row = document.createElement('div');
      row.className = 'row';
      for (const j of JOBS) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'mini'; b.textContent = j;
        b.setAttribute('aria-pressed', String(G.crew[c.slot].job === j));
        b.addEventListener('click', () => { G.crew[c.slot].job = j; syncShooters(); syncWorkers(); sound('buy'); renderPanel(true); });
        row.append(b);
      }
      el.append(row);
    } else if (!c.locked) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'buy';
      if (c.max) { b.textContent = '완료'; b.disabled = true; }
      else { b.innerHTML = costHtml(c.cost).replace(/<\/span><span/g, '</span><span'); b.disabled = !canPay(c.cost); b.addEventListener('click', () => act(c.id)); }
      el.append(b);
    }
    nodes.panel.append(el);
  }
}
function act(id) {
  ensureAudio();
  const [kind, key] = id.split(':');
  if (kind === 'gun') {
    const c = { money: GUN[key].cost(G.lv[key]) };
    if (G.lv[key] >= GUN[key].max || !canPay(c)) return;
    pay(c); G.lv[key]++;
    if (key === 'mag') for (const s of G.shooters) if (!s.reload) s.ammo = gunStat('mag');
  } else if (kind === 'stage') {
    const next = STAGES[G.stage + 1];
    if (!next || !canPay(next.cost)) return;
    pay(next.cost); G.stage++; G.hp = stage().hp;
    say(next.name + ' 완성 · 인원 슬롯이 하나 열렸다');
    syncShooters(); bakeYard();
  } else if (kind === 'fence') {
    const next = FENCES[G.fence + 1];
    if (!next || !canPay(next.cost)) return;
    pay(next.cost); G.fence++; G.fenceHp = next.hp; G.fenceDown = false; G.sideDmg = [0, 0, 0, 0]; G.sideStage = [0, 0, 0, 0];
    say(next.name + ' 완성');
    bakeYard();
  } else if (kind === 'build') {
    const b = BUILD[key], c = b.cost(G.build[key]);
    if (G.build[key] >= b.max || !canPay(c)) return;
    pay(c); G.build[key]++;
    if (G.build[key] === 1) say(b.name + ' 완성');
    bakeUnder();
  } else if (kind === 'hire') {
    const c = hireCost(hired().length);
    if (!canPay(c)) return;
    pay(c); G.crew[+key] = { job: '사수' };
    say(NAMES[+key] + ' 합류 · 아래에서 직업을 고를 수 있다');
    syncShooters(); syncWorkers();
  } else return;
  sound('buy');
  renderPanel(true);
  refreshTop();
}
function refreshTop() {
  for (const r of ['money', 'food', 'mineral', 'wood']) document.getElementById('r-' + r).textContent = fmt(G[r]);
  for (const r of ['food', 'mineral', 'wood']) {
    const net = rateOf(r) - (r === 'food' ? hired().length * UPKEEP : 0);
    const el = document.getElementById('rr-' + r);
    el.textContent = Math.abs(net) > .005 ? (net > 0 ? '+' : '−') + Math.abs(net).toFixed(1) + '/초' : '';
    el.classList.toggle('neg', net < 0);
  }
  const hero = G.shooters[0];
  nodes.waveLine.innerHTML = `<b>웨이브 ${G.wave}</b> · ${G.waveKills}/${killsNeeded(G.wave)} · ` + (hero && hero.reload > 0 ? '장전 중' : `탄창 ${hero ? hero.ammo : 0}/${gunStat('mag')}`);
  const maxHp = stage().hp;
  nodes.bunkerFill.style.width = clamp(G.hp / maxHp, 0, 1) * 100 + '%';
  nodes.bunkerText.textContent = '벙커 ' + fmt(Math.max(0, G.hp)) + '/' + fmt(maxHp);
  nodes.bunkerTrack.classList.toggle('hurt', G.hurt > 0);
  if (G.fence) {
    const max = FENCES[G.fence].hp;
    nodes.fenceFill.style.width = clamp(G.fenceHp / max, 0, 1) * 100 + '%';
    nodes.fenceText.textContent = (G.fenceDown ? '울타리 복구 ' : '울타리 ') + fmt(G.fenceHp) + '/' + fmt(max);
  } else { nodes.fenceFill.style.width = '0%'; nodes.fenceText.textContent = '울타리 없음'; }
}
function fitStage() {
  const r = nodes.stage.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const f = Math.min(r.width / W, r.height / H);
  const scale = f * dpr >= 1 ? Math.floor(f * dpr) / dpr : f;
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
}

/* ================= input ================= */
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  const hero = G.shooters[0];
  if (!hero || G.view !== 'yard') return;
  if (hero.reload > 0) { hero.reload = Math.max(.01, hero.reload - hero.reloadLen * .12); return; } // tapping hurries the reload
  let best = null, bestD = S * .9;
  for (const z of G.zombies) {
    if (z.state === 'dying' || !z.onScreen) continue;
    const d = Math.hypot(z.sx - x, z.sy - y);
    if (d < bestD) { bestD = d; best = z; }
  }
  if (best) {
    // swing round onto it, then shoot along the rifle
    hero.yaw = Math.atan2(best.y - hero.y, best.x - hero.x);
    fire(hero, best);
  }
});
nodes.speed.addEventListener('click', () => {
  G.speed = G.speed === 1 ? 2 : 1;
  nodes.speed.textContent = G.speed + '배속';
  nodes.speed.setAttribute('aria-pressed', String(G.speed === 2));
});

/* ================= settings ================= */
const settings = { sound: true, volume: .7, wind: true };
try { Object.assign(settings, JSON.parse(localStorage.getItem('bunker-idle:settings')) || {}); } catch { /* defaults */ }
const saveSettings = () => { try { localStorage.setItem('bunker-idle:settings', JSON.stringify(settings)); } catch { /* fine */ } };
const dlg = document.getElementById('settings');
const soundBtn = document.getElementById('soundToggle'), windBtn = document.getElementById('windToggle'), vol = document.getElementById('volume'), resetBtn = document.getElementById('resetBtn');
function paintSettings() {
  soundBtn.textContent = settings.sound ? '켜짐' : '꺼짐';
  windBtn.textContent = settings.wind ? '켜짐' : '꺼짐';
  vol.value = Math.round(settings.volume * 100);
}
document.getElementById('settingsBtn').addEventListener('click', () => { paintSettings(); resetBtn.textContent = '초기화'; dlg.showModal(); });
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
soundBtn.addEventListener('click', () => { settings.sound = !settings.sound; ensureAudio(); paintSettings(); saveSettings(); });
windBtn.addEventListener('click', () => { settings.wind = !settings.wind; paintSettings(); saveSettings(); });
vol.addEventListener('input', () => { settings.volume = vol.value / 100; saveSettings(); });
let skipSave = false;
resetBtn.addEventListener('click', () => {
  if (resetBtn.textContent !== '한 번 더 누르면 삭제') { resetBtn.textContent = '한 번 더 누르면 삭제'; return; }
  try { localStorage.removeItem(SAVE_KEY); } catch { /* fine */ }
  skipSave = true;
  location.reload();
});

/* ================= save ================= */
function save() {
  if (skipSave) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      money: G.money, food: G.food, mineral: G.mineral, wood: G.wood, lv: G.lv, stage: G.stage, fence: G.fence, build: G.build, crew: G.crew,
      wave: G.wave, waveKills: G.waveKills, totalKills: G.totalKills, at: Date.now(),
    }));
  } catch { /* saving is a convenience */ }
}
function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch { d = null; }
  if (d && d.lv) {
    for (const k of ['money', 'food', 'mineral', 'wood', 'waveKills', 'totalKills']) G[k] = +d[k] || 0;
    G.wave = Math.max(1, +d.wave || 1);
    for (const k of Object.keys(G.lv)) G.lv[k] = +d.lv[k] || 0;
    for (const k of Object.keys(G.build)) G.build[k] = +(d.build || {})[k] || 0;
    G.stage = clamp(+d.stage || 0, 0, STAGES.length - 1);
    G.fence = clamp(+d.fence || 0, 0, FENCES.length - 1);
    if (Array.isArray(d.crew)) G.crew = [0, 1, 2, 3, 4].map(i => d.crew[i] && JOBS.includes(d.crew[i].job) ? { job: d.crew[i].job } : null);
    // what the yard made while nobody was looking
    const away = clamp((Date.now() - (+d.at || Date.now())) / 1000, 0, OFFLINE_CAP);
    if (away > 30) {
      const gains = {};
      for (const r of ['food', 'mineral', 'wood']) gains[r] = rateOf(r) * away;
      gains.food -= hired().length * UPKEEP * away;
      for (const r of Object.keys(gains)) G[r] = Math.max(0, G[r] + gains[r]);
      const text = ['food', 'mineral', 'wood'].filter(r => gains[r] > 1).map(r => RES_NAME[r] + ' +' + fmt(gains[r])).join(', ');
      if (text) say('자리 비운 동안 ' + text);
    }
  }
  G.hp = stage().hp;
  G.fenceHp = FENCES[G.fence].hp;
}
addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

/* ================= sound ================= */
let audio = null, noiseBuffer = null, master = null, lastShot = 0;
function ensureAudio() {
  if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audio = new AC();
  master = audio.createGain();
  master.connect(audio.destination);
  noiseBuffer = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
}
function burst(type, freq, volume, length, delay = 0) {
  const now = audio.currentTime + delay, src = audio.createBufferSource(), filter = audio.createBiquadFilter(), gain = audio.createGain();
  src.buffer = noiseBuffer;
  filter.type = type; filter.frequency.value = freq; filter.Q.value = .8;
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(.0005, now + length);
  src.connect(filter).connect(gain).connect(master);
  src.start(now, Math.random() * .5, length + .02);
}
function sound(kind) {
  if (!audio || !settings.sound || document.hidden) return;
  master.gain.value = settings.volume;
  if (kind === 'shot') {
    if (audio.currentTime - lastShot < .07) return;
    lastShot = audio.currentTime;
    burst('bandpass', 1500, .06, .07); burst('lowpass', 300, .05, .08);
  }
  if (kind === 'kill') burst('lowpass', 320, .09, .14);
  if (kind === 'buy') burst('bandpass', 2400, .06, .08);
  if (kind === 'crash') { burst('lowpass', 160, .3, .6); burst('bandpass', 700, .12, .4, .05); }
  if (kind === 'thud') burst('lowpass', 240, .08, .1);
  if (kind === 'clang') burst('bandpass', 2600, .05, .12);
  if (kind === 'magout') burst('highpass', 3000, .04, .03);
  if (kind === 'magin') burst('bandpass', 1800, .07, .04);
  if (kind === 'rack') { burst('highpass', 2500, .06, .03); burst('highpass', 2200, .06, .03, .07); }
  if (kind === 'hammer') for (let k = 0; k < 3; k++) burst('bandpass', 900, .08, .05, k * .15);
  if (kind === 'chop') burst('bandpass', 700, .04, .05);
}

/* ================= boot ================= */
load();
bakeGround();
bake();
growGrass();
syncShooters();
syncWorkers();
renderPanel(true);
refreshTop();
addEventListener('resize', fitStage);
fitStage();
if (!nodes.status.textContent) say('화면 밖에서 좀비가 몰려온다 · 좀비를 누르면 직접 쏜다');
let last = performance.now(), hudIn = 0;
function frame(now) {
  // a background tab gets its time back in chunks, so the yard keeps working while hidden
  let dt = Math.min(5, (now - last) / 1000) * G.speed;
  last = now;
  while (dt > 0) { const step = Math.min(.04, dt); update(step); dt -= step; }
  draw();
  if (--hudIn <= 0) { hudIn = 6; refreshTop(); renderPanel(false); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__bunker = { G, step(dt, noDraw) { update(dt); if (!noDraw) draw(); }, act, refreshTop, renderPanel, syncShooters, syncWorkers, bake };
</script>
</body>
