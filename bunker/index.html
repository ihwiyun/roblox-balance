<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>벙커 – 좀비 방치형</title>
<style>
  :root { --ink: #1c1b19; --muted: #8b877f; --paper: #fff; --line: #d9d5cc; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 13px/1.35 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; left: 0; right: 0; top: 58px; bottom: 150px; display: grid; place-items: center; }
  canvas { display: block; image-rendering: pixelated; touch-action: manipulation; cursor: crosshair; outline: none; }
  #top { position: fixed; top: max(10px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); right: max(14px, env(safe-area-inset-right)); display: flex; justify-content: space-between; gap: 12px; pointer-events: none; }
  #money { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-variant-numeric: tabular-nums; }
  #bars { text-align: right; min-width: 150px; }
  .bar { display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-variant-numeric: tabular-nums; }
  .track { width: 84px; height: 7px; border: 1px solid var(--ink); background: #fff; }
  .fill { height: 100%; background: #6aa64a; }
  #fenceFill { background: #a0784a; }
  .bar.hurt .fill { background: #d0503c; }
  #mute { pointer-events: auto; font: inherit; color: var(--muted); background: none; border: 0; padding: 4px 0; cursor: pointer; }
  #mute:hover { color: var(--ink); }
  #status { position: fixed; left: 0; right: 0; bottom: 156px; text-align: center; color: var(--muted); pointer-events: none; min-height: 18px; }
  #status.alert { color: #c0392b; font-weight: 600; }
  #panel { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom)); width: min(600px, calc(100vw - 16px)); display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .up { font: inherit; text-align: left; background: #fff; color: var(--ink); border: 1px solid var(--ink); padding: 6px 8px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; row-gap: 1px; min-height: 64px; }
  .up:hover:not(.poor) { background: var(--ink); color: #fff; }
  .up:hover:not(.poor) .d { color: #cfcac0; }
  .up:active:not(.poor) { transform: translateY(1px); }
  .up.poor { border-color: var(--line); color: #a9a59c; cursor: default; }
  .up .n { font-weight: 700; }
  .up .lv { color: var(--muted); text-align: right; }
  .up .d { grid-column: 1 / -1; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up .c { grid-column: 1 / -1; font-weight: 700; font-variant-numeric: tabular-nums; }
  .up.poor .c { color: #c9a39a; }
  @media (max-width: 420px) { .up { padding: 5px 6px; } .up .d { font-size: 10px; } .track { width: 52px; } #bars { min-width: 0; } .bar { white-space: nowrap; font-size: 12px; } }
</style>
</head>
<body>
<div id="top">
  <div>
    <div id="money">$0</div>
    <div class="sub" id="wave">웨이브 1</div>
    <div class="sub" id="income"></div>
  </div>
  <div id="bars">
    <div class="bar" id="bunkerBar"><span id="bunkerText">벙커</span><div class="track"><div class="fill" id="bunkerFill"></div></div></div>
    <div class="bar" id="fenceBar"><span id="fenceText">울타리 없음</span><div class="track"><div class="fill" id="fenceFill"></div></div></div>
    <button id="mute" type="button" aria-pressed="false">소리 켜짐</button>
  </div>
</div>
<div id="stage"><canvas id="c" tabindex="0" aria-label="들판 한가운데 벙커. 사방에서 좀비가 몰려온다. 좀비를 누르면 직접 쏜다."></canvas></div>
<div id="status" role="status" aria-live="polite"></div>
<div id="panel"></div>
<script>
// the canvas is sized to the screen so every game pixel is a whole number of device pixels: crisp on phones too
(() => {
  const dpr = window.devicePixelRatio || 1, sw = innerWidth, sh = Math.max(220, innerHeight - 64 - 170);
  // a tall phone zooms in further and lets the field run off the sides, so the fight fills the screen
  const tall = sh > sw * 1.1;
  const NEED_W = tall ? 270 : 350, NEED_H = 230;
  const k = Math.max(1, Math.floor(Math.min(sw * dpr / NEED_W, sh * dpr / NEED_H)));
  const width = Math.min(480, Math.max(NEED_W, Math.floor(sw * dpr / k)));
  const height = Math.min(tall ? 440 : 330, Math.max(NEED_H, Math.floor(sh * dpr / k)));
  window.PP_SCENE = { width, height, scale: 16, originY: 12, field: tall ? 13.5 : 7.5 };
})();
</script>
<script src="engine.js"></script>
<script>
'use strict';
/* ---------- tuning ---------- */
const FIELD = PP_SCENE.field, B = 2.2, ROOF_Z = 2.1, FENCE_R = 4.4, BAG_R = 2.6, STOP_BUNKER = 2.95, SPAWN_R = FIELD - 1.6, RISE = .9;
const MAX_ZOMBIES = 45, OFFLINE_CAP = 2 * 3600, SAVE_KEY = 'bunker-idle:v1';
const CONCRETE = [172, 168, 156], BAG = [184, 160, 112], WOOD = [146, 104, 66], METAL = [150, 158, 164], DARK = [44, 40, 50];
const DIRT = [150, 118, 82], CRATE = [178, 134, 82], SACK = [214, 198, 156], BARREL = [150, 72, 56], OLIVE = [96, 112, 70];
const SURVIVOR = { shirt: [206, 172, 112], stripe: [188, 154, 98], legs: [70, 82, 104], hair: [92, 110, 64], skin: [222, 172, 134] };
const ZOMBIE = { shirt: [96, 86, 92], stripe: [128, 60, 56], legs: [58, 56, 72], hair: [46, 52, 40], skin: [128, 176, 96] };
const BRUTE = { shirt: [140, 48, 44], stripe: [104, 36, 36], legs: [50, 50, 62], hair: [40, 46, 36], skin: [116, 160, 86] };
const FLASH = { shirt: [250, 250, 240], stripe: [250, 250, 240], legs: [250, 250, 240], hair: [250, 250, 240], skin: [250, 250, 240] };

// each upgrade: cost = base * grow^level; val(level) is what the level gives
const UP = {
  atk:  { name: '공격력', base: 15, grow: 1.42, val: l => 12 * (1 + l * .6) * 1.06 ** l, show: v => fmt(v) + ' 피해' },
  spd:  { name: '공속',   base: 20, grow: 1.5, max: 35, val: l => 1.2 + l * .3, show: (v, l) => v.toFixed(1) + '발/초 탄창' + (6 + Math.floor(l * .7)) },
  gold: { name: '돈',     base: 25, grow: 1.5, val: l => 1 + l * .3, show: v => '보상 x' + v.toFixed(1) },
  wall: { name: '방어벽', base: 40, grow: 1.6, val: l => l ? 80 * l * 1.18 ** l : 0, show: v => v ? '울타리 ' + fmt(v) : '울타리 없음' },
  food: { name: '식량',   base: 30, grow: 1.5, val: l => 100 + 45 * l, show: (v, l) => '체력 ' + fmt(v) + ' +' + fmt(regenOf(l)) + '/초' },
  res:  { name: '자원',   base: 50, grow: 1.55, val: l => l ? l * 1.5 * 1.15 ** l : 0, show: v => '$' + fmt(v) + '/초' },
};
const regenOf = l => 1 + l * .8;
const cost = k => Math.ceil(UP[k].base * UP[k].grow ** G.lv[k]);
const stat = k => UP[k].val(G.lv[k]);
const zombieHp = w => 18 * 1.2 ** (w - 1);
const zombieDps = w => 6 * 1.13 ** (w - 1);
const zombieReward = w => 2 * 1.16 ** (w - 1);
const killsNeeded = w => 8 + w * 2;
const spawnEvery = w => Math.max(.22, 1.5 * .94 ** (w - 1));
// the gun: the 공속 upgrade also brings a bigger magazine and quicker hands
const magSize = () => 6 + Math.floor(G.lv.spd * .7);
const reloadTime = () => Math.max(.6, 1.3 * .96 ** G.lv.spd);
const ATTACK_EVERY = 1.1, STRIKE_AT = .78;

const G = {
  money: 0, wave: 1, waveKills: 0, totalKills: 0,
  lv: { atk: 0, spd: 0, gold: 0, wall: 0, food: 0, res: 0 },
  hp: 100, fenceHp: 0, fenceDown: false,
  zombies: [], tracers: [], parts: [], decals: [], sideDmg: [0, 0, 0, 0], sideStage: [0, 0, 0, 0],
  ammo: 6, reload: 0, reloadLen: 1, magOut: false, magIn: false,
  time: 0, cool: 0, spawnIn: 1, yaw: Math.PI / 4, muzzle: 0, gunTip: [0, 0, 2.4], status: '', statusT: 0, hurt: 0, saveIn: 5,
};

function fmt(n) {
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n) + '';
  const units = ['K', 'M', 'B', 'T', 'aa', 'ab', 'ac', 'ad'];
  let i = -1;
  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
  return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + units[i];
}

/* ---------- scene ---------- */
const PAPER_PX = rgb(255, 255, 255);
const KIND_DIRT = 1;
function groundColor(x, y, ix, iy) {
  const n = Math.max(Math.abs(x), Math.abs(y));
  // the field dissolves into the white page on every side
  if (n > FIELD - noise(x * .6 + 9, y * .6) * 1.1 - hash(ix, iy) * .3) return [0, 0];
  // and dissolves at the edges of the screen when the field is wider than it
  const side = Math.min(ix, W - 1 - ix), cap = Math.min(iy - 22, H - 1 - iy);
  if (side < 4 + noise(iy * .08, 3) * 10 + hash(ix, iy) * 3 || cap < 4 + noise(ix * .08, 5) * 8 + hash(ix, iy) * 3) return [0, 0];
  const clearing = Math.hypot(x, y) + noise(x * .7, y * .7) * 1.4;
  if (clearing < 4.2) {
    const ramp = rampOf(DIRT), fine = hash(ix, iy);
    if (fine > .97) return [ramp[4], KIND_DIRT];
    return [ramp[clamp(Math.floor(2.1 + noise(x * 1.6, y * 1.6) * 1.4 + (bayerAt(ix, iy) - .5) * .6), 1, 4)], KIND_DIRT];
  }
  const tone = noise(x * .3, y * .3) * 1.5 + noise(x * 1.2 + 4, y * 1.2) * .7;
  return [tuftLit[clamp(Math.floor(1 + tone + (bayerAt(ix, iy) - .5) * .6), 0, 4)], KIND_GRASS];
}
function shadowBlock(x0, y0, x1, y1, z1) {
  for (let x = x0; x <= x1; x += .45) for (let y = y0; y <= y1; y += .45) for (let z = .3; z < z1; z += .45) castShadow(x, y, z, .45);
}
function buildBunker() {
  const step = .04, dark = rampOf(DARK), steel = rampOf(METAL);
  // one row of sandbags around the foot of the bunker
  const count = 56;
  for (let k = 0; k < count; k++) {
    const t = (k / count) * 4, side = Math.floor(t) % 4, q = (t % 1) * 2 - 1, r = BAG_R;
    const [x, y] = [[r, q * r], [-q * r, r], [-r, -q * r], [q * r, -r]][side];
    sphere(x, y, .2, .25, BAG, 'rough');
    castShadow(x, y, .2, .25);
  }
  // a squat concrete block, taller than the man on its roof, with a low parapet around the roof
  box(-B, -B, 0, B, B, ROOF_Z, CONCRETE, 1);
  const P = B + .08, T = .22, top = ROOF_Z + .32;
  box(-P, P - T, ROOF_Z, P, P, top, CONCRETE, 2);
  box(P - T, -P, ROOF_Z, P, P, top, CONCRETE, 3);
  box(-P, -P, ROOF_Z, P, -P + T, top, CONCRETE, 4);
  box(-P, -P, ROOF_Z, -P + T, P, top, CONCRETE, 5);
  // stains running down from the roof, gun slits on both visible faces
  for (let a = -B; a <= B; a += step) for (let z = .05; z < ROOF_Z; z += step) {
    if (noise(a * 2.2, 1) * 1.6 > (ROOF_Z - z) && hash(a * 40 | 0, z * 40 | 0) > .5) { plot(a, B + .01, z, rampOf(CONCRETE)[1]); plot(B + .01, a, z, rampOf(CONCRETE)[1]); }
  }
  for (const c of [-1.25, 1.35]) for (let a = -.38; a <= .38; a += step) for (let z = 1.35; z <= 1.55; z += step) plot(B + .02, c + a, z, dark[0]);
  for (let a = -.38; a <= .38; a += step) for (let z = 1.35; z <= 1.55; z += step) plot(-1.2 + a, B + .02, z, dark[0]);
  // steel door on the right face
  for (let a = -.42; a <= .42; a += step) for (let z = 0; z <= 1.25; z += step) {
    const frame = Math.abs(a) > .36 || z > 1.19;
    plot(B + .03, .1 + a, z, frame ? steel[1] : steel[Math.floor(z * 5) % 2 ? 2 : 3]);
  }
  // ladder up the left face to the roof
  const LX = .9;
  for (const x of [LX - .28, LX + .28]) box(x - .045, B + .02, 0, x + .045, B + .14, top + .25, METAL, 6);
  for (let z = .3; z < top; z += .32) box(LX - .28, B + .05, z, LX + .28, B + .12, z + .06, METAL, 7);
  // radio mast with a flag on the back corner
  for (let z = top; z <= 4.4; z += .02) { plot(-1.8, -1.8, z, dark[2]); plot(-1.76, -1.8, z, dark[1]); }
  for (let a = 0; a <= .8; a += .02) for (let z = 3.9; z <= 4.35; z += .02) {
    plot(-1.8 + a, -1.8 - a * .25, z - Math.sin(a * 5) * .08, rampOf([186, 60, 50])[a > .45 ? 2 : 3]);
  }
  shadowBlock(-B, -B, B, B, ROOF_Z + .3);
  for (let z = 2.6; z < 4.3; z += .3) castShadow(-1.8, -1.8, z, .08, 1, 0);
  for (let z = .3; z < 2.6; z += .3) castShadow(LX, B + .1, z, .2, 1, 0);
}
function buildFence() {
  const lvl = G.lv.wall;
  if (!lvl) return;
  const down = G.fenceDown, h = .75 + Math.min(lvl, 12) * .05, mat = lvl >= 8 ? METAL : WOOD, R = FENCE_R, seg = R / 5;
  // side 0: y = +R, 1: x = +R, 2: y = -R, 3: x = -R; a point along a side is s in [-R, R]
  const at = (side, s) => [[s, R], [R, s], [s, -R], [-R, s]][side];
  for (let side = 0; side < 4; side++) {
    const st = down ? 3 : G.sideStage[side];
    for (let j = 0; j <= 10; j++) {
      const [x, y] = at(side, -R + j * seg);
      const snapped = down || hash(side * 11 + j, 5) < st * .22;
      const top = snapped ? .2 + hash(side * 11 + j, 3) * .25 : h + (lvl < 8 ? hash(side * 11 + j, 4) * .08 : 0);
      box(x - .08, y - .08, 0, x + .08, y + .08, top, mat, side * 11 + j);
      for (let z = .2; z < top; z += .3) castShadow(x, y, z, .12, 1, 0);
    }
    for (let j = 0; j < 10; j++) for (const [r, z] of [[0, h * .4], [1, h * .8]]) {
      const gone = down || hash(side * 23 + j, 7 + r) < st * (r ? .3 : .2);
      const a = -R + j * seg, b = a + seg;
      if (gone) {
        // the broken rail lies in the grass outside
        if (hash(side * 23 + j, 9 + r) < .6) {
          const o = 1 + hash(side * 23 + j, 11) * .5, [x0, y0] = at(side, a + .1), [x1, y1] = at(side, b - .2);
          const ox = side === 1 ? .35 * o : side === 3 ? -.35 * o : 0, oy = side === 0 ? .35 * o : side === 2 ? -.35 * o : 0;
          box(Math.min(x0, x1) + ox - .04, Math.min(y0, y1) + oy - .04, 0, Math.max(x0, x1) + ox + .04, Math.max(y0, y1) + oy + .04, .06, mat, 40 + j);
        }
        continue;
      }
      const [x0, y0] = at(side, a), [x1, y1] = at(side, b);
      box(Math.min(x0, x1) - .03, Math.min(y0, y1) - .03, z, Math.max(x0, x1) + .03, Math.max(y0, y1) + .03, z + .08, mat, 21 + side);
      for (let t = 0; t <= 1; t += .4) castShadow(lerp(x0, x1, t), lerp(y0, y1, t), z, .06, 1, 0);
    }
    if (lvl >= 4 && st < 2 && !down) {
      // barbed wire along the top
      const wire = rampOf(DARK)[2];
      for (let s = -R; s <= R; s += .03) {
        const [x, y] = at(side, s);
        plot(x, y, h + .12 + (Math.floor(s * 6) % 2 ? .05 : 0), wire);
      }
    }
  }
}
const STORE_SPOTS = [[3.15, 3.15], [3.8, 3.15], [3.15, 3.8], [3.8, 3.8], [2.5, 3.8], [3.8, 2.5]];
function buildStores() {
  // food piles up on the left of the bunker, building material on the right
  const food = Math.min(G.lv.food, 6), res = Math.min(G.lv.res, 9);
  for (let k = 0; k < food; k++) {
    const [a, b] = STORE_SPOTS[k], x = -a, y = b;
    if (k % 2) {
      capsule([x, y, .05], [x, y, .7], .26, .26, () => BARREL, 'rough');
      castShadow(x, y, .4, .28);
    } else {
      sphere(x, y, .26, .3, SACK, 'rough'); sphere(x + .08, y - .08, .58, .22, SACK, 'rough');
      castShadow(x, y, .4, .32);
    }
  }
  for (let k = 0; k < res; k++) {
    const [a, b] = STORE_SPOTS[k % 6], x = a, y = -b, z = k >= 6 ? .52 : 0;
    box(x - .26, y - .26, z, x + .26, y + .26, z + .5, k % 3 === 2 ? OLIVE : CRATE, 30 + k);
    castShadow(x, y, z + .3, .36);
  }
}
function bake() {
  zb.fill(-1e9);
  pix.fill(PAPER_PX);
  ground.fill(0);
  shadowMask.fill(0);
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const g = unproject(ix + .5, iy + .5), [c, kind] = groundColor(g.x, g.y, ix, iy), i = iy * W + ix;
    kinds[i] = kind;
    if (!c) continue;
    pix[i] = c; ground[i] = 1;
    zb[i] = (g.x + g.y) / R2 * COS;
  }
  groundZ.set(zb);
  buildBunker();
  buildFence();
  buildStores();
  bakeOcclusion();
  staticShadow.set(shadowMask);
  applyShadows(groundZ);
  bakedPix.set(pix);
  bakedZ.set(zb);
}

/* ---------- particles ---------- */
// one list for everything that flies: coins, soil, wood chips, dust, shell casings, empty magazines
const floorAt = (x, y) => Math.abs(x) < B && Math.abs(y) < B ? ROOF_Z : 0;
function part(x, y, z, vx, vy, vz, life, color, under, w = 1, h = 1) {
  G.parts.push({ x, y, z, vx, vy, vz, life, color, under, w, h });
  if (G.parts.length > 400) G.parts.shift();
}
function spray(x, y, z, n, speed, up, life, colors, w = 1, h = 1) {
  for (let k = 0; k < n; k++) {
    const a = Math.random() * 6.28, v = speed * (.4 + Math.random() * .6), c = colors[k % colors.length];
    part(x, y, z, Math.cos(a) * v, Math.sin(a) * v, up * (.5 + Math.random() * .7), life * (.7 + Math.random() * .5), c, null, w, h);
  }
}
function updateParts(dt) {
  for (const q of G.parts) {
    q.vz -= 13 * dt;
    q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
    const floor = floorAt(q.x, q.y);
    if (q.z < floor && q.z > floor - .4) {
      q.z = floor; q.vz = Math.abs(q.vz) > 1 ? -q.vz * .35 : 0; q.vx *= .55; q.vy *= .55;
    }
    q.life -= dt;
  }
  G.parts = G.parts.filter(q => q.life > 0 && q.z > -1);
}
function drawParts() {
  for (const q of G.parts) {
    const p = project(q.x, q.y, q.z), x0 = Math.round(p.sx), y0 = Math.round(p.sy);
    for (let dy = 0; dy < q.h + (q.under ? 1 : 0); dy++) for (let dx = 0; dx < q.w; dx++) {
      const ix = x0 + dx, iy = y0 + dy;
      if (ix < 0 || iy < 0 || ix >= W || iy >= H) continue;
      const i = iy * W + ix;
      if (p.d < zb[i] - .35) continue; // tucked behind the bunker or a zombie
      pix[i] = dy >= q.h ? q.under : q.color;
    }
  }
}

/* ---------- zombies ---------- */
function spawn() {
  const r = SPAWN_R - Math.random() * .5, side = Math.floor(Math.random() * 4), s = (Math.random() * 2 - 1) * r;
  let [x, y] = [[r, s], [s, r], [-r, s], [s, -r]][side];
  // pull the spot in towards the bunker until it is on visible ground with room around it
  for (let k = 0; k < 60 && Math.max(Math.abs(x), Math.abs(y)) > FENCE_R + 1; k++) {
    const p = project(x, y, 0), ix = p.sx | 0, iy = p.sy | 0;
    if (ix > 14 && ix < W - 14 && iy > 46 && iy < H - 10 && ground[iy * W + ix]) break;
    x *= .96; y *= .96;
  }
  const w = G.wave, brute = w >= 3 && Math.random() < .08;
  const hp = zombieHp(w) * (brute ? 7 : 1) * (.9 + Math.random() * .2);
  G.zombies.push({
    x, y, n: Math.max(Math.abs(x), Math.abs(y)), hp, max: hp, brute,
    speed: (.42 + Math.random() * .2 + Math.min(w, 40) * .005) * (brute ? .7 : 1),
    dps: zombieDps(w) * (brute ? 3 : 1), reward: zombieReward(w) * (brute ? 6 : 1),
    scale: brute ? .85 : .62 + Math.random() * .05, phase: Math.random() * 6.28,

/* ---------- loop ---------- */

function update(dt) {

    if (G.fenceDown && G.fenceHp >= max * .4) { G.fenceDown = false; G.sideDmg = [0, 0, 0, 0]; G.sideStage = [0, 0, 0, 0]; bake(); say('울타리를 다시 세웠다'); sound('hammer'); }

    const max = stat('wall');
    nodes.fenceFill.style.width = clamp(G.fenceHp / max, 0, 1) * 100 + '%';
    nodes.fenceText.textContent = (G.fenceDown ? '울타리 복구 중 ' : '울타리 ') + fmt(G.fenceHp) + '/' + fmt(max);
  } else {
    nodes.fenceFill.style.width = '0%';
    nodes.fenceText.textContent = '울타리 없음';
  }
  for (const [k, u] of Object.entries(UP)) {
    const b = buttons[k], l = G.lv[k], maxed = u.max != null && l >= u.max, price = cost(k);
    b.children[0].textContent = u.name;
    b.children[1].textContent = 'Lv ' + l;
    b.children[2].textContent = maxed ? u.show(u.val(l), l) : u.show(u.val(l), l) + ' → ' + u.show(u.val(l + 1), l + 1).replace(/^[^\d$x]*/, '');
    b.children[3].textContent = maxed ? '최대' : '$' + fmt(price);
    b.classList.toggle('poor', maxed || G.money < price);
  }
}
function fitStage() {
  nodes.stage.style.bottom = nodes.panel.offsetHeight + 30 + 'px';
  nodes.status.style.bottom = nodes.panel.offsetHeight + 12 + 'px';
  const r = nodes.stage.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const f = Math.min(r.width / W, r.height / H);
  // whole device pixels per game pixel whenever they fit, so nothing smears
  const scale = f * dpr >= 1 ? Math.floor(f * dpr) / dpr : f;
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
}

/* ---------- input ---------- */
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  // a tap on a zombie is a free extra shot
  let best = null, bestD = 22;
  for (const z of G.zombies) {
    if (z.state === 'dying' || z.n > FIELD) continue;
    const d = Math.hypot(z.sx - x, z.sy - y);
    if (d < bestD) { bestD = d; best = z; }
  }
  if (G.reload > 0) { G.reload = Math.max(.01, G.reload - G.reloadLen * .12); return; } // tapping hurries the reload
  if (best) {
    G.yaw = Math.atan2(best.y, best.x);
    shoot(best);
  }
});

/* ---------- save ---------- */
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ money: G.money, wave: G.wave, waveKills: G.waveKills, totalKills: G.totalKills, lv: G.lv, at: Date.now() }));
  } catch { /* saving is a convenience */ }
}
function load() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch { data = null; }
  if (data && data.lv) {
    G.money = +data.money || 0; G.wave = +data.wave || 1; G.waveKills = +data.waveKills || 0; G.totalKills = +data.totalKills || 0;
    for (const k of Object.keys(G.lv)) G.lv[k] = +data.lv[k] || 0;
    const away = clamp((Date.now() - (+data.at || Date.now())) / 1000, 0, OFFLINE_CAP);
    const gain = stat('res') * away;
    if (gain >= 1) { G.money += gain; say('자리 비운 동안 자원 +$' + fmt(gain)); }
  }
  G.hp = stat('food');
  G.fenceHp = stat('wall');
  G.ammo = magSize();
  if (!G.status) say('좀비가 사방에서 온다 · 좀비를 누르면 직접 쏜다');
}
addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

/* ---------- sound ---------- */
let audio = null, muted = false, noiseBuffer = null, lastShot = 0;
function ensureAudio() {
  if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audio = new AC();
  noiseBuffer = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
}
function burst(type, freq, volume, length, delay = 0) {
  const now = audio.currentTime + delay, src = audio.createBufferSource(), filter = audio.createBiquadFilter(), gain = audio.createGain();
  src.buffer = noiseBuffer;
  filter.type = type; filter.frequency.value = freq; filter.Q.value = .8;
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(.0005, now + length);
  src.connect(filter).connect(gain).connect(audio.destination);
  src.start(now, Math.random() * .5, length + .02);
}
function sound(kind) {
  if (!audio || muted || document.hidden) return;
  if (kind === 'shot') {
    if (audio.currentTime - lastShot < .06) return; // fast fire rates would turn into a hiss
    lastShot = audio.currentTime;
    burst('bandpass', 1600, .05, .06);
  }
  if (kind === 'kill') burst('lowpass', 320, .09, .12);
  if (kind === 'buy') burst('bandpass', 2400, .06, .08);
  if (kind === 'crash') { burst('lowpass', 160, .3, .6); burst('bandpass', 700, .12, .4, .05); }
  if (kind === 'thud') burst('lowpass', 240, .1, .1);
  if (kind === 'crack') { burst('lowpass', 200, .14, .14); burst('bandpass', 1100, .06, .08); }
  if (kind === 'magout') burst('highpass', 3000, .04, .03);
  if (kind === 'magin') burst('bandpass', 1800, .07, .04);
  if (kind === 'rack') { burst('highpass', 2500, .06, .03); burst('highpass', 2200, .06, .03, .07); }
  if (kind === 'hammer') for (let k = 0; k < 3; k++) burst('bandpass', 900, .08, .05, k * .15);
}
const muteButton = document.getElementById('mute');
muteButton.addEventListener('click', () => {
  muted = !muted;
  muteButton.textContent = muted ? '소리 꺼짐' : '소리 켜짐';
  muteButton.setAttribute('aria-pressed', String(muted));
});

/* ---------- boot ---------- */
load();
bake();
growGrass();
refreshHud(true);
addEventListener('resize', fitStage);
fitStage();
let last = performance.now();
function frame(now) {
  // a background tab gets its time back in chunks, so an idle game keeps running while hidden
  let dt = Math.min(5, (now - last) / 1000);
  last = now;
  while (dt > 0) { const step = Math.min(.04, dt); update(step); dt -= step; }
  draw();
  refreshHud(false);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__bunker = { G, step(dt) { update(dt); draw(); }, buy };
</script>
</body>
