<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>벙커 – 좀비 방치형</title>
<style>
  /* the pixel-plays look: a picture on white paper, small monospace text, thin ink lines */
  :root { --ink: #1c1b19; --muted: #8b877f; --paper: #fff; --line: #e4e0d8; --soft: #f6f4ef; --bad: #c0392b; --top: 48px; --bottom: 256px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 13px/1.4 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }
  canvas.ico { image-rendering: pixelated; flex: none; display: block; }

  #top { position: fixed; top: 0; left: 0; right: 0; height: var(--top); padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left)); display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; z-index: 3; pointer-events: none; }
  #res { display: flex; flex-wrap: wrap; gap: 0 12px; align-items: center; min-width: 0; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rate { color: var(--muted); font-weight: 400; font-size: 11px; }
  .rate.neg { color: var(--bad); }
  #waveLine { flex-basis: 100%; color: var(--muted); font-size: 12px; }
  #waveLine b { color: var(--ink); }
  #topBtns { display: flex; flex: none; pointer-events: auto; }
  .tbtn { background: none; border: 0; color: var(--muted); padding: 6px 7px; cursor: pointer; white-space: nowrap; }
  .tbtn:hover, .tbtn[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  #stage { position: fixed; left: 0; right: 0; top: var(--top); bottom: var(--bottom); display: grid; place-items: center; overflow: hidden; }
  canvas#c { display: block; image-rendering: pixelated; touch-action: manipulation; cursor: crosshair; outline: none; }
  #hp { position: fixed; left: max(8px, env(safe-area-inset-left)); bottom: calc(var(--bottom) + 6px); background: rgba(255, 255, 255, .92); border: 1px solid var(--ink); padding: 5px 7px; display: grid; grid-template-columns: auto 72px; gap: 4px 8px; align-items: center; pointer-events: none; font-size: 11px; }
  #hp .lbl { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .track { height: 7px; border: 1px solid var(--ink); background: #fff; }
  .fill { height: 100%; background: #6aa64a; width: 0; }
  #fenceFill { background: #a0784a; }
  .hurt .fill { background: #d0503c; }
  #status { position: fixed; left: 0; right: 0; top: calc(var(--top) + 2px); text-align: center; pointer-events: none; color: var(--muted); padding: 0 12px; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; z-index: 2; }
  #status.alert { color: var(--bad); font-weight: 700; }
  #labels span { position: fixed; transform: translate(0, -100%); font-size: 11px; font-weight: 700; color: var(--ink); background: rgba(255, 255, 255, .85); padding: 0 4px; pointer-events: none; white-space: nowrap; }
  #banner { position: fixed; left: 0; right: 0; top: calc(var(--top) + 36px); text-align: center; font-size: 22px; font-weight: 700; pointer-events: none; opacity: 0; color: var(--ink); text-shadow: 0 0 4px #fff, 0 0 4px #fff, 0 0 4px #fff; }
  #banner.on { animation: banner 2s ease-out; }
  @keyframes banner { 0% { opacity: 0; transform: translateY(6px); } 12% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; } }

  #bottom { position: fixed; left: 0; right: 0; bottom: 0; height: var(--bottom); border-top: 1px solid var(--ink); background: var(--paper); display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
  #panel { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); align-content: start; }
  #tabs { display: grid; grid-template-columns: repeat(4, 1fr); flex: none; border-top: 1px solid var(--ink); }
  .tab { background: var(--paper); border: 0; padding: 5px 2px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--muted); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 700; box-shadow: inset 0 2px 0 var(--ink); }
  .card { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .card .icon { grid-row: span 2; width: 40px; height: 40px; display: grid; place-items: center; background: var(--soft); border: 1px solid var(--line); align-self: start; overflow: hidden; }
  .card .body { min-width: 0; }
  .card .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .card .name { font-weight: 700; }
  .card .lv { color: var(--muted); }
  .card .desc { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .tired { height: 4px; background: var(--line); margin-top: 3px; max-width: 160px; }
  .tired span { display: block; height: 100%; background: #c8935a; }
  .buy { min-width: 76px; display: flex; flex-direction: column; align-items: center; background: var(--paper); border: 1px solid var(--ink); padding: 5px 8px; cursor: pointer; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 12px; }
  .buy:hover:not([disabled]) { background: var(--ink); color: #fff; }
  .buy:active:not([disabled]) { transform: translateY(1px); }
  .buy[disabled] { border-color: var(--line); color: #b3afa7; cursor: default; }
  .buy .short { color: var(--bad); }
  .row { grid-column: 2 / -1; display: flex; gap: 4px; flex-wrap: wrap; }
  .mini { background: var(--paper); border: 1px solid var(--line); padding: 4px 9px; cursor: pointer; font-size: 12px; }
  .mini[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  dialog { border: 1px solid var(--ink); padding: 16px; width: min(320px, calc(100vw - 32px)); font: inherit; color: var(--ink); background: var(--paper); }
  dialog::backdrop { background: rgba(255, 255, 255, .75); }
  dialog h2 { margin: 0 0 12px; font-size: 14px; }
  .set { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .set input[type=range] { width: 130px; accent-color: var(--ink); }
  .danger { color: var(--bad); border-color: var(--bad); }
  @media (max-width: 440px) { :root { --top: 76px; --bottom: 266px; } #panel { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="top">
  <div id="res">
    <span class="chip" data-ico="coin"><span id="r-money">0</span></span>
    <span class="chip" data-ico="food"><span id="r-food">0</span><span class="rate" id="rr-food"></span></span>
    <span class="chip" data-ico="mineral"><span id="r-mineral">0</span><span class="rate" id="rr-mineral"></span></span>
    <span id="waveLine"></span>
  </div>
  <div id="topBtns">
    <button class="tbtn" id="viewBtn" type="button" aria-pressed="false">지하</button>
    <button class="tbtn" id="speed" type="button" aria-pressed="false">1배속</button>
    <button class="tbtn" id="settingsBtn" type="button">설정</button>
  </div>
</div>
<div id="stage"><canvas id="c" tabindex="0" aria-label="흰 바탕에 떠 있는 섬 한가운데 벙커. 섬 가장자리 너머에서 좀비가 몰려온다. 좀비를 누르면 직접 쏜다."></canvas></div>
<div id="status" role="status" aria-live="polite"></div>
<div id="labels" hidden></div>
<div id="banner" aria-hidden="true"></div>
<div id="hp">
  <span class="lbl" id="bunkerText">벙커</span><div class="track" id="bunkerTrack"><div class="fill" id="bunkerFill"></div></div>
  <span class="lbl" id="fenceText">울타리 없음</span><div class="track"><div class="fill" id="fenceFill"></div></div>
</div>
<div id="bottom">
  <div id="panel"></div>
  <div id="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="gun" data-ico="bullet" aria-selected="true">무기</button>
    <button class="tab" role="tab" data-tab="def" data-ico="bunker" aria-selected="false">방어</button>
    <button class="tab" role="tab" data-tab="under" data-ico="bed" aria-selected="false">지하</button>
    <button class="tab" role="tab" data-tab="crew" data-ico="person" aria-selected="false">인원</button>
  </div>
</div>
<dialog id="settings">
  <h2>설정</h2>
  <div class="set"><span>효과음</span><button class="mini" id="soundToggle" type="button">켜짐</button></div>
  <div class="set"><span>음량</span><input type="range" id="volume" min="0" max="100" value="70"></div>
  <div class="set"><span>풀 흔들림</span><button class="mini" id="windToggle" type="button">켜짐</button></div>
  <div class="set"><span>진행 초기화</span><button class="mini danger" id="resetBtn" type="button">초기화</button></div>
  <form method="dialog" style="text-align:right;margin-top:12px"><button class="mini">닫기</button></form>
</dialog>
<script>
// the canvas: about 360 game pixels across (one world unit is 10 pixels, as in the first version),
// blown up by a whole number of device pixels; the island is sized to fit
(() => {
  const r = document.getElementById('stage').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const k = Math.max(1, Math.floor(Math.min(r.width * dpr / 360, r.height * dpr / 230)));
  const width = Math.min(440, Math.floor(r.width * dpr / k)), height = Math.min(340, Math.floor(r.height * dpr / k));
  const field = Math.max(7.5, Math.min(11.5, (width - 16) / 28.3, (height - 50) / 14.14));
  window.PP_SCENE = { width, height, scale: 10, originY: 4, field, grassDensity: .17 };
})();
</script>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
