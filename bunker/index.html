<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>벙커 – 좀비 방치형</title>
<style>
  /* the pixel-plays look: a picture on white paper, small monospace text, thin ink lines */
  :root { --ink: #1c1b19; --muted: #8b877f; --paper: #fff; --line: #e4e0d8; --soft: #f6f4ef; --bad: #c0392b; --glass: rgba(255, 255, 255, .92);
    /* the status bar and the screen edges; the bottom bar; the two sheets that slide up over the picture */
    --st: env(safe-area-inset-top, 0px); --sl: max(8px, env(safe-area-inset-left, 0px)); --sr: max(8px, env(safe-area-inset-right, 0px));
    --nav: calc(56px + env(safe-area-inset-bottom, 0px)); --sheet-up: clamp(220px, 47vh, 300px); --sheet-ug: clamp(240px, 45vh, 380px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); }
  body { word-break: keep-all; font: 13px/1.4 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }
  canvas.ico { image-rendering: pixelated; flex: none; display: block; }
  /* longhands only: a background shorthand here would reset the picture the .ic-<name> rules give (and win over them) */
  i.ic { display: inline-block; flex: none; width: calc(16px * var(--s, 1)); height: calc(16px * var(--s, 1)); background-position: center; background-size: 100% 100%; background-repeat: no-repeat; image-rendering: pixelated; vertical-align: middle; }
  img.por { display: block; flex: none; image-rendering: pixelated; }
  /* what can be pressed is at least 48x48, also when it looks smaller: an invisible box centred on it */
  .tap { position: relative; }
  .tap::after { content: ''; position: absolute; left: 50%; top: 50%; width: max(100%, 48px); height: max(100%, 48px); transform: translate(-50%, -50%); }

  /* one portrait frame: phones use the whole screen, wider screens get the same frame in the middle (480 px at most) */
  #app { position: fixed; top: 0; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; overflow: hidden; background: var(--paper); }
  @media (min-width: 481px) { #app { box-shadow: 0 0 0 1px var(--line); } }
  #stage { position: absolute; left: 0; right: 0; top: 0; bottom: var(--nav); overflow: hidden; }
  .ui-up #stage { bottom: calc(var(--nav) + var(--sheet-up)); }
  .ui-ug #stage { bottom: calc(var(--nav) + var(--sheet-ug)); }
  /* always centred, also when it is bigger than the stage (the closer view below ground, or a sheet is up) */
  canvas#c { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; image-rendering: pixelated; touch-action: manipulation; cursor: crosshair; outline: none; }

  /* top left: the resources, one under the other, each with its rate on the line below */
  #res { position: absolute; left: var(--sl); top: calc(var(--st) + 6px); width: 76px; display: grid; gap: 4px; z-index: 3; pointer-events: none; }
  .res { display: grid; grid-template-columns: 16px minmax(0, 1fr); column-gap: 4px; align-items: center; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 16px; }
  .res small { grid-column: 2; min-height: 12px; color: var(--muted); font-weight: 700; font-size: 11px; line-height: 12px; }
  .res small.neg { color: var(--bad); }
  /* top middle: the wave, stepped with the arrows; the bar is this wave's kills */
  #wave { position: absolute; top: calc(var(--st) + 6px); left: 0; right: 0; width: max-content; margin: 0 auto; display: grid; justify-items: center; gap: 4px; z-index: 3; }
  .pill { display: flex; align-items: stretch; height: 36px; border: 1px solid var(--ink); background: var(--glass); font-weight: 700; }
  .pill button { border: 0; background: none; padding: 0; font-weight: 700; cursor: pointer; }
  .pill .arr { width: 36px; display: grid; place-items: center; }
  #wavePrev::after { left: auto; right: 0; transform: translateY(-50%); } #waveNext::after { left: 0; transform: translateY(-50%); }
  .pill .arr[disabled] { cursor: default; } .pill .arr[disabled] canvas { opacity: .35; }
  .pill button:active:not([disabled]) { background: var(--soft); }
  #waveBtn { min-width: 94px; padding: 0 4px; white-space: nowrap; font-size: 14px; font-variant-numeric: tabular-nums; }
  #wave .bar { width: 140px; height: 4px; background: var(--line); }
  #wave .bar i { display: block; height: 100%; width: 0; background: var(--ink); }
  /* top right: settings, and under it the side buttons */
  .ib { width: 48px; height: 48px; padding: 0; border: 0; background: none; display: grid; place-items: center; cursor: pointer; }
  .ib:active, .ibl:active { background: var(--soft); }
  #settingsBtn { position: absolute; right: var(--sr); top: var(--st); z-index: 3; }
  #side { position: absolute; right: var(--sr); top: calc(var(--st) + 56px); display: grid; gap: 8px; z-index: 3; }
  .ibl { width: 48px; height: 48px; padding: 0; border: 0; background: none; display: grid; justify-items: center; align-content: start; gap: 2px; font-size: 11px; line-height: 14px; font-weight: 700; color: var(--ink); cursor: pointer; }
  /* notifications: a translucent band across the picture, faded at both ends, with a thin line above and below.
     It stays between the resources and the side buttons, under the wave, so it never covers a button */
  #notes { position: absolute; left: calc(var(--sl) + 84px); right: calc(var(--sr) + 56px); top: calc(var(--st) + 58px); display: grid; justify-items: center; pointer-events: none; z-index: 4; }
  .note { position: relative; width: 100%; padding: 8px 12px; text-align: center; color: #fff;
    background: linear-gradient(90deg, transparent, rgba(28, 27, 25, .72) 18%, rgba(28, 27, 25, .72) 82%, transparent);
    animation: note 2.7s ease-out forwards; }
  .note::before, .note::after { content: ''; position: absolute; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--line-c, rgba(255, 255, 255, .8)) 22%, var(--line-c, rgba(255, 255, 255, .8)) 78%, transparent); }
  .note::before { top: 3px; } .note::after { bottom: 3px; }
  .note b { display: block; font-size: 16px; line-height: 20px; }
  .note span { display: block; margin-top: 2px; font-size: 11px; line-height: 14px; font-weight: 700; color: rgba(255, 255, 255, .8); }
  .note.danger { --line-c: #ff7a64; } .note.danger b { color: #ffd2c8; }
  .note.new { --line-c: #ffd60a; } .note.new b { color: #fff1b0; }
  .note.good { --line-c: #9fe07a; }
  .note.long { animation-duration: 3.4s; }
  @keyframes note { 0% { opacity: 0; transform: translateY(10px) scaleY(.7); } 9% { opacity: 1; transform: none; } 84% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-8px); } }
  /* bottom left: the bunker and the fence */
  #hp { position: absolute; left: var(--sl); bottom: calc(var(--nav) + 8px); z-index: 3; background: var(--glass); border: 1px solid var(--ink); padding: 5px 7px; display: grid; grid-template-columns: auto 72px; gap: 4px 8px; align-items: center; pointer-events: none; font-size: 11px; }
  #hp .lbl { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .track { height: 7px; border: 1px solid var(--ink); background: #fff; }
  .fill { height: 100%; background: #6aa64a; width: 0; }
  #fenceFill { background: #a0784a; }
  .hurt .fill { background: #d0503c; }
  /* bottom right: the hero's magazine (a big number, a bar while reloading), the speed button right above it */
  #br { position: absolute; right: var(--sr); bottom: calc(var(--nav) + 8px); display: grid; justify-items: end; gap: 8px; z-index: 3; }
  #speed { width: 48px; height: 32px; padding: 0; border: 1px solid var(--ink); background: var(--glass); font-weight: 700; white-space: nowrap; cursor: pointer; }
  #speed:active { transform: translateY(1px); }
  #speed[aria-pressed="true"] { background: var(--ink); color: #fff; }
  #ammo { position: relative; height: 32px; background: var(--glass); border: 1px solid var(--ink); padding: 0 8px; display: flex; align-items: center; gap: 4px; pointer-events: none; font-variant-numeric: tabular-nums; }
  #ammo .n { font-size: 14px; font-weight: 700; line-height: 1; }
  #ammo .n small { font-size: 11px; font-weight: 700; color: var(--muted); }
  #ammo .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--line); }
  #ammo .bar i { display: block; height: 100%; width: 0; background: #e0a72c; }
  #ammo.empty .n { color: var(--bad); }
  /* a sheet up: the picture keeps the resources; a full-screen menu covers all of it */
  .ui-sheet .res small, .ui-sheet .res.gem, .ui-sheet #wave, .ui-sheet #settingsBtn, .ui-sheet #side, .ui-sheet #hp, .ui-sheet #br { display: none; }
  .ui-full #res, .ui-full #wave, .ui-full #settingsBtn, .ui-full #side, .ui-full #hp, .ui-full #br, .ui-full #notes { display: none; }

  /* the bottom bar */
  #tabs { position: absolute; left: 0; right: 0; bottom: 0; height: var(--nav); padding-bottom: env(safe-area-inset-bottom, 0px); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--ink); background: var(--paper); z-index: 6; }
  .tab { background: var(--paper); border: 0; padding: 5px 0 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: 11px; font-weight: 700; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 700; box-shadow: inset 0 3px 0 var(--ink); }
  /* the menus: a sheet over the bottom of the picture (강화, 기지 지하), or the whole screen with a title and ✕ */
  #menu { position: absolute; left: 0; right: 0; bottom: var(--nav); display: flex; flex-direction: column; background: var(--paper); z-index: 5; }
  #menu[hidden] { display: none; }
  .ui-up #menu { height: var(--sheet-up); border-top: 1px solid var(--ink); }
  .ui-ug #menu { height: var(--sheet-ug); border-top: 1px solid var(--ink); }
  .ui-full #menu { top: 0; bottom: 0; padding: var(--st) 0 env(safe-area-inset-bottom, 0px); z-index: 8; }
  #menuHead { display: none; }
  .ui-full #menuHead { display: flex; flex: none; height: 48px; align-items: center; justify-content: space-between; padding-left: 12px; border-bottom: 1px solid var(--ink); font-size: 16px; }
  #menuClose { width: 48px; height: 48px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; }
  #menuClose:active { background: var(--soft); }
  #menuTabs { display: flex; flex: none; border-bottom: 1px solid var(--line); }
  #menuTabs:empty { display: none; }
  #menuTabs button { flex: 1; min-width: 0; min-height: 48px; padding: 0 2px; border: 0; background: none; color: var(--muted); cursor: pointer; white-space: nowrap; }
  #menuTabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--ink); }
  #panel { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px 12px; }
  #menuFoot { flex: none; display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--ink); background: var(--paper); }
  #menuFoot:empty { display: none; }
  #menuFoot .btn { flex: 1; }

  /* what the menus are made of */
  .sec { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 12px 0 8px; font-weight: 700; }
  .sec > span:last-child { font-size: 11px; color: var(--muted); }
  #panel > .sec:first-child { margin-top: 2px; }
  .grid { display: grid; gap: 8px; }
  .c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); } .c6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .muted { color: var(--muted); font-weight: 400; }
  .ph { background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
  .off { opacity: .45; }
  .gr { font-weight: 700; color: var(--g); }
  .g0 { --g: #9a9a9a; } .g1 { --g: #4caf50; } .g2 { --g: #3d7be0; } .g3 { --g: #9b4fd1; }
  .g4 { --g: #f08a24; } .g5 { --g: #d63a3a; } .g6 { --g: #c99a10; } .g7 { --g: #e0459b; }
  /* square slots of the collections (weapons, turrets, relics), framed in the colour of their grade */
  .slot { position: relative; aspect-ratio: 1; border: 2px solid var(--g, var(--line)); background: var(--soft); display: grid; place-items: center; color: var(--muted); font-size: 10px; text-align: center; overflow: hidden; }
  .g7.slot { border-image: linear-gradient(90deg, #e04545, #f0b020, #45c070, #4590e0, #a050e0) 1; }
  .slot .sil { position: absolute; inset: 18%; background: var(--ink); opacity: .16; }
  /* a box with a picture and a label: crew, workers, turret and relic upgrades */
  .cell { display: grid; justify-items: center; align-content: start; gap: 2px; min-width: 0; min-height: 44px; padding: 4px 3px; border: 1px solid var(--line); background: var(--paper); font-size: 11px; text-align: center; }
  button.cell { cursor: pointer; font-size: 11px; }
  .cell .ph { width: 100%; }
  .cell[aria-pressed="true"] { border-color: var(--ink); }
  .cell .cost { font-size: 11px; }
  .cell .ic.hire { opacity: .35; }
  .chips { display: grid; gap: 4px; margin: 0 0 6px; }
  .chip { min-width: 0; min-height: 44px; padding: 0 2px; border: 1px solid var(--line); background: var(--paper); font-size: 12px; cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed="true"] { border-color: var(--ink); font-weight: 700; }
  .chip[disabled] { opacity: .45; cursor: default; }
  /* chips: small (28 tall, 48 to press), the picked one filled; a group sits at the top right of its list */
  .tool { display: flex; justify-content: flex-end; padding: 4px 0 8px; }
  .chipset { display: flex; gap: 8px; }
  .fchip { flex: none; height: 28px; min-width: 40px; padding: 0 8px; border: 1px solid var(--line); background: var(--paper); color: var(--g, var(--ink)); font-size: 13px; white-space: nowrap; cursor: pointer; }
  .fchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 700; }
  .fchip:active:not([aria-pressed="true"]) { background: var(--soft); }
  .fchip[disabled] { color: #b3afa7; cursor: default; }
  /* an upgrade: picture, name and level, progress, and the price to pay */
  .ucard { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; padding: 8px; border: 1px solid var(--line); }
  .ucard .body { flex: 1; min-width: 0; }
  .ucard .name { font-weight: 700; }
  .ucard .sub { color: var(--muted); font-size: 11px; font-weight: 700; }
  .pic { flex: none; } .pic.lg { width: 72px; height: 56px; } .pic.md { width: 72px; height: 44px; } .pic.sm { width: 40px; height: 40px; }
  .prog { width: 120px; max-width: 100%; height: 4px; margin-top: 8px; background: var(--line); }
  .prog i { display: block; height: 100%; background: var(--ink); }
  .tired { width: 120px; max-width: 100%; height: 4px; margin-top: 3px; background: var(--line); }
  .tired span { display: block; height: 100%; background: #c8935a; }
  /* prices on the buy buttons: a resource icon and the amount, red when short */
  .cost { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  .cost .ci { width: 16px; height: 16px; background-size: 16px 16px; image-rendering: pixelated; flex: none; }
  .buy { flex: none; min-width: 80px; height: 36px; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--paper); border: 1px solid var(--ink); padding: 0 12px; cursor: pointer; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
  .buy:active:not([disabled]) { transform: translateY(1px); background: var(--soft); }
  .buy[disabled] { border-color: var(--line); color: #b3afa7; cursor: default; }
  .buy .short { color: var(--bad); }
  .btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 6px 8px; border: 1px solid var(--ink); background: var(--paper); font-weight: 700; text-align: center; cursor: pointer; }
  .btn.dark { background: var(--ink); color: #fff; }
  .btn[disabled] { cursor: default; }
  /* the button scale: primary filled ink (one a screen) > secondary outline > chips and icons. 48 is only for pressing */
  .b { display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); font-weight: 700; font-size: 13px; white-space: nowrap; flex: none; cursor: pointer; }
  .b.pri { height: 44px; padding: 0 16px; background: var(--ink); color: #fff; }
  .b.sub { height: 36px; padding: 0 12px; }
  .b.sm { height: 32px; padding: 0 10px; }
  .b.grow { flex: 1; }
  .b:active:not([disabled]) { transform: translateY(1px); } .b.sub:active:not([disabled]) { background: var(--soft); } .b.pri:active:not([disabled]) { opacity: .8; }
  .b[disabled] { border-color: var(--line); color: #b3afa7; cursor: default; } .b.pri[disabled] { background: var(--line); color: var(--muted); }
  .b[disabled] i.ic { opacity: .45; }
  .num { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .aux { font-size: 11px; line-height: 14px; font-weight: 700; color: var(--muted); }
  /* the summon strip on top of a 장비 tab: level and odds, then one pull and ten */
  .strip { display: flex; align-items: center; gap: 8px; margin: -8px -12px 0; padding: 8px 12px; background: var(--soft); }
  .strip .lv { flex: 1; min-width: 0; display: grid; gap: 4px; }
  .strip .lv b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .lv > span { display: flex; align-items: center; gap: 8px; }
  .prog2 { flex: 1; height: 4px; background: var(--line); } .prog2 i { display: block; height: 100%; background: var(--ink); }
  .link { font-size: 11px; line-height: 14px; font-weight: 700; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
  /* grade chips: one row that slides sideways, its cut end faded until it is slid to the end */
  .chiprow { display: flex; gap: 8px; margin: 0 -12px; padding: 12px 12px 8px; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent); }
  .chiprow::-webkit-scrollbar { display: none; }
  .chiprow.end { -webkit-mask-image: none; mask-image: none; }
  .gq { font-weight: 700; }
  .slot img.gun { filter: brightness(0); opacity: .35; }
  .slot.lock { border-color: var(--line); background: var(--paper); align-content: center; gap: 2px; }
  .slot em { position: absolute; left: 3px; bottom: 1px; font-style: normal; font-size: 11px; line-height: 14px; font-weight: 700; color: var(--ink); }
  .slot.ring { outline: 2px solid var(--ink); outline-offset: 2px; overflow: visible; }
  .wslot img.gun, .slot.ring img.gun { filter: none; opacity: 1; }
  .strip.mid { margin: 0 -12px 8px; }
  /* 캐릭터: the one picked standing (the game's sprite x4, idle), the weapon slot beside them, then who they are */
  .hero { display: flex; align-items: flex-end; justify-content: center; gap: 24px; height: 168px; margin: -8px -12px 0; padding-bottom: 16px; background: var(--soft); }
  .stand { display: block; flex: none; image-rendering: pixelated; background-repeat: no-repeat; animation: stand var(--t) steps(var(--n)) infinite; }
  @keyframes stand { to { background-position: calc(var(--w) * var(--n) * -1) 0; } }
  @media (prefers-reduced-motion: reduce) { .stand { animation: none; } }
  .wslot { align-self: center; display: grid; justify-items: center; gap: 4px; padding: 0; border: 0; background: none; cursor: pointer; }
  .wslot .slot { width: 64px; }
  .wslot:active .slot { background: var(--line); }
  .info { padding-top: 12px; } .t16 { font-size: 16px; font-weight: 700; } .info .role { margin: 4px 0 8px; }
  .acts { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .wpick { margin: 12px -12px 0; padding: 0 12px 12px; border-top: 1px solid var(--ink); }
  .wpick .sh { display: flex; align-items: center; justify-content: space-between; height: 48px; }
  .wpick p { margin: 8px 0; }
  .rowline { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 32px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .rowline > span:last-child { display: flex; align-items: center; gap: 6px; }
  .go { width: 100%; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; padding: 6px; border: 1px solid var(--line); background: var(--paper); text-align: left; cursor: pointer; }
  .go > span { flex: 1; }
  .mini { min-height: 44px; min-width: 44px; background: var(--paper); border: 1px solid var(--line); padding: 4px 9px; cursor: pointer; font-size: 12px; }
  .mini[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .mini[disabled] { color: #b3afa7; cursor: default; }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; min-width: 0; }

  /* the end of a run */
  #over { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(255, 255, 255, .86); }
  #over[hidden] { display: none; }
  #over .box { border: 1px solid var(--ink); background: #fff; padding: 18px 22px; text-align: center; width: min(320px, calc(100% - 32px)); }
  #over h2 { margin: 0 0 6px; font-size: 18px; color: var(--bad); }
  #over p { margin: 4px 0 14px; color: var(--muted); }
  /* power saving: black, only the wave, the gold a minute and the time since it began */
  #saver { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: #000; color: var(--muted); font-variant-numeric: tabular-nums; touch-action: manipulation; cursor: default; }
  #saver[hidden] { display: none; }
  #saver > div { display: grid; justify-items: center; gap: 12px; }
  #saver b { font-size: 18px; color: var(--line); }
  #saver span { display: inline-flex; align-items: center; gap: 6px; }

  dialog { border: 1px solid var(--ink); padding: 16px; width: min(320px, calc(100vw - 32px)); font: inherit; color: var(--ink); background: var(--paper); }
  dialog::backdrop { background: rgba(255, 255, 255, .75); }
  dialog h2 { margin: 0 0 12px; font-size: 14px; }
  .set { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .set input[type=range] { width: 130px; height: 44px; margin: 0; accent-color: var(--ink); }
  .set .row { flex: 1; }
  .danger { color: var(--bad); border-color: var(--bad); }
</style>
</head>

    <button class="tab" role="tab" type="button" data-tab="base" data-ico="bunker" data-s="2" aria-selected="false">기지</button>

</div>
<div id="saver" hidden><div><b id="svWave">스테이지 1</b><span data-ico="coin" data-s="1"><span id="svGold">0/분</span></span><span id="svTime">0:00:00</span></div></div>
<dialog id="settings">

  <div class="set"><span>배경음악</span><input type="range" id="music" min="0" max="100" value="70"></div>
  <div class="set"><span>풀 흔들림</span><button class="mini" id="windToggle" type="button">켜짐</button></div>
  <div class="set"><span>절전 모드</span><button class="mini" id="saverToggle" type="button">꺼짐</button></div>
  <div class="set"><span>도감</span><button class="mini" id="codexBtn" type="button">0/40</button></div>
  <div class="set"><span>진행 초기화</span><button class="mini danger" id="resetBtn" type="button">초기화</button></div>
  <form method="dialog" style="text-align:right;margin-top:12px"><button class="mini">닫기</button></form>
</dialog>
<dialog id="stageDlg">
  <h2 id="sdTitle">스테이지 1</h2>
  <div class="set"><div class="row"><button class="mini" id="modeRepeat" type="button" aria-pressed="false">반복</button><button class="mini" id="modeAdvance" type="button" aria-pressed="true">진행</button></div></div>
  <div class="set"><span>금화</span><b id="sdGold">0/분</b></div>
  <div class="set"><span>처치</span><b id="sdKills">0/분</b></div>
  <form method="dialog" style="text-align:right;margin-top:12px"><button class="mini">닫기</button></form>
</dialog>
<script>
// the canvas: about 360-480 game pixels across, blown up by a whole number of device pixels so every game
// pixel stays a crisp square. One world unit is 16 pixels, sized for 32x32 characters. The picture is sized
// for the stage of the main screen (everything above the bottom bar); a sheet that slides up only moves it
(() => {
  const r = document.getElementById('stage').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  // at least 360 game pixels across and 300 down; phones keep the biggest pixels
  const k = Math.max(1, Math.floor(Math.min(r.width * dpr / 360, r.height * dpr / 300)));
  const width = Math.min(480, Math.floor(r.width * dpr / k)), height = Math.min(620, Math.floor(r.height * dpr / k));
  // the island is a diamond that fits the picture with a margin: 2.83 * 16 px wide and 1.41 * 16 px tall per unit
  const field = Math.max(6.4, Math.min(9, (width - 20) / 45.3, (height - 70) / 22.6));
  // below ground the picture is shown one step closer, above the 기지 sheet: the part of it that still fits there
  const probe = document.createElement('div');
  probe.style.cssText = 'position:absolute;visibility:hidden;height:var(--sheet-ug)';
  document.body.append(probe);
  const ugH = Math.max(1, r.height - probe.offsetHeight);
  probe.remove();
  const kk = Math.max(1, Math.floor(Math.min(r.width * dpr / width, r.height * dpr / height)));
  const underView = { w: Math.min(width, Math.floor(r.width * dpr / (kk + 1))), h: Math.min(height, Math.floor(ugH * dpr / (kk + 1))) };
  window.PP_SCENE = { width, height, scale: 16, originY: 10, field, grassDensity: .11, underView };
})();
</script>
