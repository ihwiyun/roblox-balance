<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>벙커 – 좀비 방치형</title>
<style>
  /* the pixel-plays look: a picture on white paper, small monospace text, thin ink lines */
  :root { --ink: #1c1b19; --muted: #8b877f; --paper: #fff; --line: #e4e0d8; --soft: #f6f4ef; --bad: #c0392b; --top: 48px; --bottom: 256px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); }
  body { word-break: keep-all; font: 13px/1.4 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }
  canvas.ico { image-rendering: pixelated; flex: none; display: block; }

  #top { position: fixed; top: 0; left: 0; right: 0; height: var(--top); padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left)); display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; z-index: 3; pointer-events: none; }
  #res { display: flex; flex-wrap: wrap; gap: 0 12px; align-items: center; min-width: 0; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rate { color: var(--muted); font-weight: 400; font-size: 11px; }
  .rate.neg { color: var(--bad); }
  /* how full the pantry and the ore store are: a thin bar under the number */
  .chip.store { position: relative; padding-bottom: 3px; }
  .chip .cap { position: absolute; left: 20px; right: 0; bottom: 0; height: 2px; background: var(--line); }
  .chip .cap b { display: block; height: 100%; width: 0; background: #8a8; }
  .chip .cap b.full { background: #d08a2a; }
  /* prices on the buy buttons: a resource icon and the amount, red when short */
  .cost { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  .cost .ci { width: 12px; height: 12px; background-size: 12px 12px; image-rendering: pixelated; flex: none; }
  .buy { gap: 1px; }
  .buy .short { color: var(--bad); }
  /* the end of a run */
  #over { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(255, 255, 255, .86); }
  #over[hidden] { display: none; }
  #over .box { border: 1px solid var(--ink); background: #fff; padding: 18px 22px; text-align: center; width: min(320px, calc(100vw - 32px)); }
  #over h2 { margin: 0 0 6px; font-size: 18px; color: var(--bad); }
  #over p { margin: 4px 0 14px; color: var(--muted); }
  #waveLine { flex-basis: 100%; color: var(--muted); font-size: 12px; word-break: keep-all; }
  #waveLine b { color: var(--ink); }
  #topBtns { display: flex; flex: none; pointer-events: auto; }
  .tbtn { background: none; border: 0; color: var(--muted); padding: 6px 7px; cursor: pointer; white-space: nowrap; }
  .tbtn:hover, .tbtn[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  #stage { position: fixed; left: 0; right: 0; top: var(--top); bottom: var(--bottom); overflow: hidden; }
  /* always centred, also when it is bigger than the stage (the closer view below ground) */
  canvas#c { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; image-rendering: pixelated; touch-action: manipulation; cursor: crosshair; outline: none; }
  #hp { position: fixed; left: max(8px, env(safe-area-inset-left)); bottom: calc(var(--bottom) + 6px); background: rgba(255, 255, 255, .92); border: 1px solid var(--ink); padding: 5px 7px; display: grid; grid-template-columns: auto 72px; gap: 4px 8px; align-items: center; pointer-events: none; font-size: 11px; }
  #hp .lbl { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .track { height: 7px; border: 1px solid var(--ink); background: #fff; }
  .fill { height: 100%; background: #6aa64a; width: 0; }
  #fenceFill { background: #a0784a; }
  .hurt .fill { background: #d0503c; }
  #status { position: fixed; left: 0; right: 0; top: calc(var(--top) + 2px); text-align: center; pointer-events: none; color: var(--muted); padding: 0 12px; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; z-index: 2; }
  #status.alert { color: var(--bad); font-weight: 700; }
  #labels span { position: fixed; transform: translate(0, -100%); font-size: 11px; font-weight: 700; color: var(--ink); background: rgba(255, 255, 255, .85); padding: 0 4px; pointer-events: none; white-space: nowrap; }
  /* floor buttons over the underground picture */
  /* floor buttons below ground: a small lift panel in the top-left corner of the picture */
  #floors { position: fixed; left: max(6px, env(safe-area-inset-left)); top: calc(var(--top) + 6px); display: grid; gap: 3px; z-index: 3; }
  #floors[hidden] { display: none; }
  .fbtn { width: 42px; padding: 2px 0 3px; background: rgba(255, 255, 255, .9); border: 1px solid var(--line); cursor: pointer; display: grid; justify-items: center; line-height: 1.15; font-size: 10px; color: var(--muted); }
  .fbtn b { font-size: 13px; }
  .fbtn[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); background: #fff; box-shadow: inset 3px 0 0 var(--ink); }
  /* below ground the hero's magazine does not matter */
  .under #ammo { display: none; }
  #labels span.fl { transform: translate(0, -50%); display: grid; text-align: right; line-height: 1.25; }
  #labels span.fl b { font-weight: 700; }
  /* notifications: a translucent band across the picture, faded at both ends, with a thin line above and below */
  #notes { position: fixed; left: 0; right: 0; top: calc(var(--top) + 9vh); display: grid; justify-items: center; pointer-events: none; z-index: 4; }
  .note { position: relative; width: min(600px, 100%); padding: 10px 28px 11px; text-align: center; color: #fff;
    background: linear-gradient(90deg, transparent, rgba(28, 27, 25, .72) 18%, rgba(28, 27, 25, .72) 82%, transparent);
    animation: note 2.7s ease-out forwards; }
  .note::before, .note::after { content: ''; position: absolute; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--line-c, rgba(255, 255, 255, .8)) 22%, var(--line-c, rgba(255, 255, 255, .8)) 78%, transparent); }
  .note::before { top: 3px; } .note::after { bottom: 3px; }
  .note b { display: block; font-size: 17px; letter-spacing: .02em; }
  .note span { display: block; margin-top: 3px; font-size: 12px; color: rgba(255, 255, 255, .8); }
  .note.danger { --line-c: #ff7a64; } .note.danger b { color: #ffd2c8; }
  .note.new { --line-c: #ffd60a; } .note.new b { color: #fff1b0; }
  .note.good { --line-c: #9fe07a; }
  .note.long { animation-duration: 3.4s; }
  @keyframes note { 0% { opacity: 0; transform: translateY(10px) scaleY(.7); } 9% { opacity: 1; transform: none; } 84% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-8px); } }
  /* the hero's magazine: a big number at the bottom right, a bar while reloading */
  #ammo { position: fixed; right: max(8px, env(safe-area-inset-right)); bottom: calc(var(--bottom) + 6px); background: rgba(255, 255, 255, .92); border: 1px solid var(--ink); padding: 4px 8px 5px; display: grid; grid-template-columns: auto auto; align-items: center; gap: 0 6px; pointer-events: none; font-variant-numeric: tabular-nums; }
  #ammo .n { font-size: 22px; font-weight: 700; line-height: 1; }
  #ammo .n small { font-size: 12px; font-weight: 400; color: var(--muted); }
  #ammo .bar { grid-column: 1 / -1; height: 4px; margin-top: 3px; background: var(--line); }
  #ammo .bar i { display: block; height: 100%; width: 0; background: #e0a72c; }
  #ammo.empty .n { color: var(--bad); }
  .wide #ammo { right: calc(var(--side) + 10px); bottom: 10px; }
  .wide #notes { right: var(--side); }

  #bottom { position: fixed; left: 0; right: 0; bottom: 0; height: var(--bottom); border-top: 1px solid var(--ink); background: var(--paper); display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
  #panel { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); align-content: start; }
  #tabs { display: grid; grid-template-columns: repeat(4, 1fr); flex: none; border-top: 1px solid var(--ink); }
  .tab { background: var(--paper); border: 0; padding: 5px 2px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--muted); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 700; box-shadow: inset 0 2px 0 var(--ink); }
  .card { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .card .icon { grid-row: span 2; width: 40px; height: 40px; display: grid; place-items: center; background: var(--soft); border: 1px solid var(--line); align-self: start; overflow: hidden; }
  .card .body { min-width: 0; }
  .card .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .card .name { font-weight: 700; }
  .card .lv { color: var(--muted); }
  .card .desc { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .prog { height: 3px; background: var(--line); margin: 3px 0 2px; max-width: 220px; }
  .prog i { display: block; height: 100%; background: var(--ink); }
  .tired { height: 4px; background: var(--line); margin-top: 3px; max-width: 160px; }
  .tired span { display: block; height: 100%; background: #c8935a; }
  .buy { min-width: 76px; display: flex; flex-direction: column; align-items: center; background: var(--paper); border: 1px solid var(--ink); padding: 5px 8px; cursor: pointer; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 12px; }
  .buy:hover:not([disabled]) { background: var(--ink); color: #fff; }
  .buy:active:not([disabled]) { transform: translateY(1px); }
  .buy[disabled] { border-color: var(--line); color: #b3afa7; cursor: default; }
  .row { grid-column: 2 / -1; display: flex; gap: 4px; flex-wrap: wrap; }
  .mini { background: var(--paper); border: 1px solid var(--line); padding: 4px 9px; cursor: pointer; font-size: 12px; }
  .mini[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  dialog { border: 1px solid var(--ink); padding: 16px; width: min(320px, calc(100vw - 32px)); font: inherit; color: var(--ink); background: var(--paper); }
  dialog::backdrop { background: rgba(255, 255, 255, .75); }
  dialog h2 { margin: 0 0 12px; font-size: 14px; }
  .set { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .set input[type=range] { width: 130px; accent-color: var(--ink); }
  .danger { color: var(--bad); border-color: var(--bad); }
  @media (max-width: 440px) { :root { --top: 76px; --bottom: 266px; } #panel { grid-template-columns: 1fr; } }
  /* short phones: a lower panel leaves the picture room for the three floors below ground */
  @media (max-width: 440px) and (max-height: 720px) { :root { --bottom: 206px; } }
  /* wide screens: the panel stands on the right, the picture takes the rest */
  .wide { --side: 400px; }
  .wide #bottom { left: auto; top: var(--top); width: var(--side); height: auto; border-top: 0; border-left: 1px solid var(--ink); }
  .wide #panel { grid-template-columns: 1fr; }
  .wide #stage { right: var(--side); bottom: 0; }
  .wide #hp { bottom: 10px; }
  .wide #status { right: var(--side); }
</style>
</head>
<body>
<div id="top">
  <div id="res">
    <span class="chip" data-ico="coin"><span id="r-money">0</span></span>
    <span class="chip store" data-ico="food"><span id="r-food">0</span><span class="rate" id="rr-food"></span><i class="cap"><b id="cap-food"></b></i></span>
    <span class="chip store" data-ico="mineral"><span id="r-mineral">0</span><span class="rate" id="rr-mineral"></span><i class="cap"><b id="cap-mineral"></b></i></span>
    <span id="waveLine"></span>
  </div>
  <div id="topBtns">
    <button class="tbtn" id="viewBtn" type="button" aria-pressed="false">지하</button>
    <button class="tbtn" id="speed" type="button" aria-pressed="false">1배속</button>
    <button class="tbtn" id="settingsBtn" type="button">설정</button>
  </div>
</div>
<div id="stage"><canvas id="c" tabindex="0" aria-label="흰 바탕에 떠 있는 섬 한가운데 벙커. 섬 가장자리 너머에서 좀비가 몰려온다. 좀비를 누르면 직접 쏜다."></canvas></div>
<div id="status" role="status" aria-live="polite"></div>
<div id="labels" hidden></div>
<div id="floors" hidden role="group" aria-label="지하 층 선택">
  <button type="button" class="fbtn" data-floor="0" aria-label="지하 1층 생활"><b>B1</b><span>생활</span></button>
  <button type="button" class="fbtn" data-floor="1" aria-label="지하 2층 식량"><b>B2</b><span>식량</span></button>
  <button type="button" class="fbtn" data-floor="2" aria-label="지하 3층 채굴"><b>B3</b><span>채굴</span></button>
</div>
<div id="notes" aria-live="polite"></div>
<div id="ammo" aria-label="탄약"><span data-ico="bullet"></span><span class="n" id="ammoNum">0<small>/0</small></span><div class="bar"><i id="ammoBar"></i></div></div>
<div id="hp">
  <span class="lbl" id="bunkerText">벙커</span><div class="track" id="bunkerTrack"><div class="fill" id="bunkerFill"></div></div>
  <span class="lbl" id="fenceText">울타리 없음</span><div class="track"><div class="fill" id="fenceFill"></div></div>
</div>
<div id="bottom">
  <div id="panel"></div>
  <div id="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="gun" data-ico="bullet" aria-selected="true">무기</button>
    <button class="tab" role="tab" data-tab="def" data-ico="bunker" aria-selected="false">방어</button>
    <button class="tab" role="tab" data-tab="under" data-ico="bed" aria-selected="false">지하</button>
    <button class="tab" role="tab" data-tab="crew" data-ico="person" aria-selected="false">인원</button>
  </div>
</div>
<div id="over" hidden role="alertdialog" aria-labelledby="overTitle"><div class="box"><h2 id="overTitle">기지 함락</h2><p>식량이 떨어진 채로 기지가 무너졌다</p><p class="stats"></p><button class="mini danger" id="restart" type="button">처음부터 다시</button></div></div>
<dialog id="settings">
  <h2>설정</h2>
  <div class="set"><span>효과음</span><button class="mini" id="soundToggle" type="button">켜짐</button></div>
  <div class="set"><span>음량</span><input type="range" id="volume" min="0" max="100" value="70"></div>
  <div class="set"><span>풀 흔들림</span><button class="mini" id="windToggle" type="button">켜짐</button></div>
  <div class="set"><span>진행 초기화</span><button class="mini danger" id="resetBtn" type="button">초기화</button></div>
  <form method="dialog" style="text-align:right;margin-top:12px"><button class="mini">닫기</button></form>
</dialog>
<script>
// the canvas: about 360-480 game pixels across, blown up by a whole number of device pixels so every game
// pixel stays a crisp square. One world unit is 16 pixels, sized for 32x32 characters. Wide screens put the
// panel on the right so the picture gets the full height (three floors underground need it)
(() => {
  const wide = innerWidth >= 900 && innerWidth > innerHeight * 1.15;
  document.documentElement.classList.toggle('wide', wide);
  const r = document.getElementById('stage').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  // at least 360 game pixels across and 300 down (400 on wide screens, where the height is there for the
  // three floors below ground); phones keep the biggest pixels
  const k = Math.max(1, Math.floor(Math.min(r.width * dpr / 360, r.height * dpr / (wide ? 400 : 300))));
  const width = Math.min(480, Math.floor(r.width * dpr / k)), height = Math.min(620, Math.floor(r.height * dpr / k));
  // the island is a diamond that fits the picture with a margin: 2.83 * 16 px wide and 1.41 * 16 px tall per unit
  const field = Math.max(6.4, Math.min(9, (width - 20) / 45.3, (height - 70) / 22.6));
  // below ground the picture is shown one step closer: the part of it that still fits the stage
  const kk = Math.max(1, Math.floor(Math.min(r.width * dpr / width, r.height * dpr / height)));
  const underView = { w: Math.min(width, Math.floor(r.width * dpr / (kk + 1))), h: Math.min(height, Math.floor(r.height * dpr / (kk + 1))) };
  window.PP_SCENE = { width, height, scale: 16, originY: 10, field, grassDensity: .11, underView };
})();
</script>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="art/humans.js"></script>
<script src="art/zombiesA.js"></script>
<script src="art/zombiesB.js"></script>
<!-- the game, one file per job; they share globals and load in this order -->
<script src="src/config.js"></script>
<script src="src/buildings.js"></script>
<script src="src/facilities.js"></script>
<script src="src/state.js"></script>
<script src="src/sprites.js"></script>
<script src="src/fx.js"></script>
<script src="src/layers.js"></script>
<script src="src/yard.js"></script>
<script src="src/under.js"></script>
<script src="src/crew.js"></script>
<script src="src/zombies.js"></script>
<script src="src/actors.js"></script>
<script src="src/loop.js"></script>
<script src="src/sound.js"></script>
<script src="src/hud.js"></script>
<script src="src/main.js"></script>
</body>
</html>
