<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>화면 설계도</title>
<style>
  :root { --ink: #1c1b19; --muted: #8b877f; --paper: #fff; --line: #e4e0d8; --soft: #f6f4ef; --bad: #c0392b; --glass: rgba(255, 255, 255, .92); --off: #b3afa7;
    /* one phone frame; ?w=390&h=844 checks another size */
    --fw: 360px; --fh: 800px; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #ece9e2; color: var(--ink); font: 12px/1.35 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; word-break: keep-all; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .wrap { display: flex; flex-wrap: wrap; gap: 18px; }
  .scr { width: var(--fw); }
  .scr > b { display: block; margin: 0 0 6px; font-size: 13px; }
  .frame { position: relative; width: var(--fw); height: var(--fh); background: var(--paper); border: 1px solid var(--ink); overflow: hidden; }
  img.ico { image-rendering: pixelated; display: inline-block; vertical-align: middle; flex: none; }
  .nav img.ico, .sb img.ico, .card > img.ico { display: block; }
  /* 메인 화면 */
  .game { position: absolute; left: 0; right: 0; top: 0; bottom: 74px; background: #fff url(game.png) center 46% / var(--fw) auto no-repeat; image-rendering: pixelated; }
  .res { position: absolute; left: 8px; top: 30px; display: grid; gap: 4px; }
  .res div { display: grid; grid-template-columns: 16px auto; column-gap: 4px; align-items: center; font-weight: 700; }
  .res small { grid-column: 2; color: var(--muted); font-weight: 400; font-size: 10px; margin-top: -2px; }
  .status { position: absolute; left: 0; right: 0; top: 0; height: 24px; background: #00000010; font-size: 10px; color: var(--muted); padding: 5px 10px; }
  .bar { height: 4px; width: 140px; background: var(--line); } .bar i { display: block; height: 100%; width: 40%; background: var(--ink); }
  /* the bottom bar: five tabs */
  .nav { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; border-top: 1px solid var(--ink); background: var(--paper); display: grid; grid-template-columns: repeat(5, 1fr); }
  .nav div { display: grid; justify-items: center; align-content: center; gap: 2px; color: var(--muted); font-size: 11px; }
  .nav div.on { color: var(--ink); font-weight: 700; box-shadow: inset 0 3px 0 var(--ink); }
  /* 전체 화면 메뉴 (UI 안의 UI): 제목 16, 닫기는 도트 아이콘(24, 누르는 영역 48) */
  .head { height: 48px; border-bottom: 1px solid var(--ink); display: flex; align-items: center; justify-content: space-between; padding: 0 0 0 12px; font-weight: 700; font-size: 16px; margin-top: 24px; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs div { flex: 1; text-align: center; padding: 8px 0; color: var(--muted); }
  .tabs div.on { color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--ink); }
  .body { padding: 8px 10px; }
  .sec { font-weight: 700; margin: 8px 0 4px; display: flex; justify-content: space-between; }
  .img { background: repeating-linear-gradient(45deg, #f2efe8, #f2efe8 4px, #e7e3da 4px, #e7e3da 8px); border: 1px dashed #c9c3b6; display: grid; place-items: center; color: #a9a294; font-size: 9px; }
  .grid { display: grid; gap: 5px; }
  .g5 { grid-template-columns: repeat(5, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); } .g3 { grid-template-columns: repeat(3, 1fr); } .g2 { grid-template-columns: repeat(2, 1fr); } .g6 { grid-template-columns: repeat(6, 1fr); }
  .it { border: 2px solid var(--g, var(--line)); position: relative; aspect-ratio: 1; }
  .it .img { position: absolute; inset: 2px; border: 0; }
  .it em { position: absolute; left: 2px; bottom: 1px; font-style: normal; font-size: 9px; font-weight: 700; }
  .it u { position: absolute; right: 2px; top: 1px; text-decoration: none; font-size: 9px; color: var(--muted); }
  .q0 { --g: #9a9a9a; } .q1 { --g: #4caf50; } .q2 { --g: #3d7be0; } .q3 { --g: #9b4fd1; } .q4 { --g: #f08a24; } .q5 { --g: #d63a3a; } .q6 { --g: #c99a10; } .q7 { --g: #e0459b; }
  .gr { color: var(--g); font-weight: 700; }
  .btn { border: 1px solid var(--ink); background: var(--paper); padding: 6px 8px; font-weight: 700; text-align: center; }
  .btn.dark { background: var(--ink); color: #fff; }
  .row, .card.row { display: flex; gap: 6px; align-items: center; }
  .card { border: 1px solid var(--line); padding: 6px; display: grid; gap: 4px; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0; }
  .chips span { border: 1px solid var(--line); padding: 2px 6px; font-size: 10px; }
  .chips span.on { border-color: var(--ink); font-weight: 700; }
  .line { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid var(--ink); background: var(--paper); padding: 8px 10px; display: flex; gap: 6px; }
  .foot .btn { flex: 1; }

  /* ===== 2차: 강약 (바뀐 화면만, .v2) =====
     글자: 제목 16 굵게 / 구역 13 굵게 / 본문 13 / 숫자 14 굵게(고정폭 숫자) / 보조 11 흐리게. 간격은 4·8 단위.
     크기 강약: 주요 버튼(채움, 높이 44) > 보조 버튼(테두리, 36) > 칩(28)·아이콘(16·24·32). 48은 누르는 영역에만. */
  .v2 { font-size: 13px; line-height: 1.4; }
  .v2 .t16 { font-size: 16px; font-weight: 700; }
  .v2 .num { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .v2 .aux { font-size: 11px; line-height: 14px; color: var(--muted); font-weight: 400; }
  .v2 .tabs div { font-size: 13px; height: 48px; padding: 0; display: grid; place-items: center; }
  /* 누르는 영역: 작게 보이는 것도 보이지 않는 48×48을 가운데에 둡니다 (?tap=1 이면 보임) */
  .tap { position: relative; }
  .tap::after { content: ''; position: absolute; left: 50%; top: 50%; width: max(100%, 48px); height: max(100%, 48px); transform: translate(-50%, -50%); }
  .showtap .tap::after, .tapdemo .tap::after { outline: 1px dashed #c0392b; outline-offset: -1px; }
  /* 버튼: 주요(pri)는 검정으로 채움(화면에 하나), 보조(sub)는 테두리만 */
  .b { display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); font-weight: 700; font-size: 13px; white-space: nowrap; flex: none; }
  .b.pri { height: 44px; padding: 0 16px; background: var(--ink); color: #fff; }
  .b.sub { height: 36px; padding: 0 12px; }
  .b.sm { height: 32px; padding: 0 10px; }
  .b.grow { flex: 1; }
  .b.down { transform: translateY(1px); } .b.sub.down { background: var(--soft); } .b.pri.down { opacity: .8; }
  .b.off { border-color: var(--line); background: var(--paper); color: var(--off); }
  .b.pri.off { background: var(--line); border-color: var(--line); color: var(--muted); }
  .b.off img.ico { opacity: .45; }
  .b .short { color: var(--bad); }
  /* 칩: 높이 28, 고른 것만 채움. 등급색은 글자에만 */
  .chip { height: 28px; min-width: 40px; padding: 0 8px; border: 1px solid var(--line); background: var(--paper); color: var(--g, var(--ink)); font-size: 13px; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; flex: none; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 700; }
  .chip.down { background: var(--soft); }
  .chip.off { color: var(--off); }
  .chipset { display: flex; gap: 8px; }
  /* 아이콘 버튼: 상자 없이 아이콘만, 누르는 영역 48 */
  .ib { width: 48px; height: 48px; display: grid; place-items: center; flex: none; }
  .ib.down { background: var(--soft); }
  .ib.off img.ico { opacity: .4; }
  .ibl { width: 48px; height: 48px; display: grid; justify-items: center; align-content: start; gap: 2px; font-size: 11px; line-height: 14px; font-weight: 700; color: var(--ink); }
  /* 등급 칸: 테두리는 등급색, 칸 안에 그림·Lv·합성 개수 */
  .slot2 { position: relative; aspect-ratio: 1; border: 2px solid var(--g, var(--line)); background: var(--soft); display: grid; place-items: center; }
  .slot2 em { position: absolute; left: 3px; bottom: 1px; font-style: normal; font-size: 11px; line-height: 14px; font-weight: 700; }
  .slot2 u { position: absolute; right: 3px; top: 1px; text-decoration: none; font-size: 11px; line-height: 14px; color: var(--muted); }
  .slot2 u.full { color: var(--ink); font-weight: 700; }
  .slot2.no { opacity: .35; }
  .slot2.no img { filter: brightness(0); opacity: .35; }
  .slot2 .img { position: absolute; inset: 2px; border: 0; }
  .slot2.lock { border-color: var(--line); background: var(--paper); align-content: center; gap: 2px; text-align: center; }
  .slot2.ring { outline: 2px solid var(--ink); outline-offset: 2px; }
  img.gun, img.por, img.spr { image-rendering: pixelated; display: block; }
  .sec2 { display: flex; justify-content: space-between; align-items: baseline; margin: 12px 0 8px; font-weight: 700; }
  .sec2 .aux { font-weight: 400; }
  .grid2 { display: grid; gap: 8px; }
  .c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); } .c6 { grid-template-columns: repeat(6, minmax(0, 1fr)); } .c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  /* 전체 화면 메뉴의 세로 배치 */
  .fs { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .fs > .status { position: relative; flex: none; }
  .fs > .head { margin-top: 0; flex: none; }
  .fs > .tabs, .fs > .strip, .fs > .chiprow, .fs > .hero, .fs > .info, .fs > .foot2 { flex: none; }
  .fs > .list { flex: 1; min-height: 0; overflow: hidden; padding: 0 12px; }
  /* 뽑기 줄 (각 장비 탭 맨 위, 캐릭터의 동료 모집): 소환 Lv 막대, [1회] 보조, [10회] 주요 */
  .strip { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--soft); }
  .strip .lv { flex: 1; min-width: 0; display: grid; gap: 4px; }
  .strip .lv b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .lv span { display: flex; align-items: center; gap: 8px; }
  .prog2 { flex: 1; height: 4px; background: var(--line); } .prog2 i { display: block; height: 100%; background: var(--ink); }
  .link { font-size: 11px; line-height: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
  /* 등급 필터 칩 한 줄: 옆으로 밀어 봅니다(화면 끝에서 잘려 보임) */
  .chiprow { display: flex; gap: 8px; padding: 12px 12px 8px; overflow: hidden; }
  .foot2 { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--ink); background: var(--paper); }
  .kv { display: flex; justify-content: space-between; align-items: center; height: 28px; border-bottom: 1px solid var(--line); }

  /* 1. 메인 */
  .res2 { position: absolute; left: 8px; top: 32px; width: 72px; display: grid; gap: 4px; }
  .res2 .r { display: grid; grid-template-columns: 16px minmax(0, 1fr); column-gap: 4px; align-items: center; }
  .res2 .r .num { line-height: 16px; }
  .res2 .r small { grid-column: 2; font-size: 11px; line-height: 12px; color: var(--muted); }
  .stage2 { position: absolute; left: 50%; top: 32px; transform: translateX(-50%); display: grid; justify-items: center; gap: 4px; }
  .pill2 { display: flex; height: 36px; border: 1px solid var(--ink); background: var(--glass); }
  .pill2 .arr { width: 36px; display: grid; place-items: center; }
  /* the arrows' 48 reach outward, so they never take taps from the label between them */
  .pill2 .pv::after { left: auto; right: 0; transform: translateY(-50%); } .pill2 .nx::after { left: 0; transform: translateY(-50%); }
  .pill2 .lbl { min-width: 94px; display: grid; place-items: center; }
  .stage2 .bar2 { width: 140px; height: 4px; background: var(--line); } .stage2 .bar2 i { display: block; width: 40%; height: 100%; background: var(--ink); }
  .gear2 { position: absolute; right: 8px; top: 28px; }
  .side2 { position: absolute; right: 8px; top: 84px; display: grid; gap: 8px; }
  /* 알림 띠: 재화와 오른쪽 아이콘 사이, 스테이지 아래. 버튼을 가리지 않음 */
  .note2 { position: absolute; left: 88px; right: 64px; top: 84px; padding: 4px 0; text-align: center; color: #fff; background: linear-gradient(90deg, transparent, #1c1b19b8 18%, #1c1b19b8 82%, transparent); border-top: 1px solid #ffffff50; border-bottom: 1px solid #ffffff50; }
  .note2 b { display: block; font-size: 16px; line-height: 20px; } .note2 span { display: block; font-size: 11px; line-height: 14px; color: #ffffffcc; }
  .spd2 { position: absolute; right: 8px; bottom: 124px; width: 48px; height: 32px; border: 1px solid var(--ink); background: var(--glass); display: grid; place-items: center; font-weight: 700; }
  .ammo2 { position: absolute; right: 8px; bottom: 84px; height: 32px; padding: 0 8px; border: 1px solid var(--ink); background: var(--glass); display: flex; align-items: center; gap: 4px; }
  .ammo2 small { font-size: 11px; color: var(--muted); }
  .hp2 { position: absolute; left: 8px; bottom: 84px; border: 1px solid var(--ink); background: var(--glass); padding: 4px 8px; font-size: 11px; line-height: 14px; display: grid; grid-template-columns: auto 60px; gap: 2px 8px; align-items: center; }
  .hp2 i { display: block; height: 6px; border: 1px solid var(--ink); background: #6aa64a; } .hp2 i.f { background: #a0784a; }
  /* 2. 강화 */
  .sheet2 { position: absolute; left: 0; right: 0; bottom: 74px; height: 326px; border-top: 1px solid var(--ink); background: var(--paper); }
  .tool { display: flex; justify-content: flex-end; padding: 12px 12px 8px; }
  .uc2 { display: flex; align-items: center; gap: 8px; margin: 0 12px 4px; padding: 8px; border: 1px solid var(--line); }
  .uc2:last-child { margin-bottom: 0; }
  .uc2 .bd { flex: 1; min-width: 0; }
  .uc2 .bd .prog2 { flex: none; width: 120px; max-width: 100%; margin-top: 8px; }
  .uc2 .b { min-width: 80px; }
  /* 4. 캐릭터 */
  .hero { position: relative; height: 168px; background: var(--soft); display: flex; align-items: flex-end; justify-content: center; gap: 24px; padding-bottom: 16px; }
  .wslot { width: 64px; display: grid; justify-items: center; gap: 4px; align-self: center; margin-top: 8px; }
  .wslot .slot2 { width: 64px; }
  .info { padding: 12px 12px 0; }
  .info .nm { display: flex; align-items: baseline; gap: 8px; }
  .info .role { display: flex; align-items: center; gap: 4px; margin: 4px 0 8px; }
  .acts { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; }
  .crew2 { display: grid; justify-items: center; gap: 4px; padding: 4px 0; border: 1px solid transparent; }
  .crew2.sel { border-color: var(--ink); }
  .crew2 .pf { width: 52px; height: 52px; border: 2px solid var(--g, var(--line)); background: var(--soft); display: grid; place-items: center; }
  .crew2.no .pf img { filter: brightness(0); opacity: .16; }
  .crew2 span { font-size: 11px; line-height: 14px; }
  .crew2.no span { color: var(--muted); }
  /* 4-1. 무기 고르기 (아래에서 올라오는 판) */
  .wsheet { position: absolute; left: 0; right: 0; bottom: 0; padding-bottom: 12px; background: var(--paper); border-top: 1px solid var(--ink); }
  .wsheet .sh { display: flex; align-items: center; justify-content: space-between; height: 48px; padding-left: 12px; flex: none; }
  /* 7·8. 상점 */
  .pk { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; padding: 8px; border: 1px solid var(--line); margin-bottom: 8px; }
  .pk .slot2 { width: 64px; }
  .pk .bd { display: grid; gap: 4px; }
  .pk .b { margin-top: 4px; width: 100%; }
  .pk.locked .slot2 { opacity: .5; }
  .gem { display: grid; justify-items: center; gap: 4px; padding: 8px; border: 1px solid var(--line); }
  /* 15. 강약 규칙 */
  .lg { display: grid; grid-template-columns: 44px repeat(3, minmax(0, 1fr)); align-items: center; justify-items: center; row-gap: 12px; column-gap: 4px; }
  .lg > .aux:first-child, .lg > .lh { justify-self: start; }
  .tapdemo { display: flex; align-items: center; justify-content: space-around; height: 64px; }
  .types > div { display: flex; justify-content: space-between; align-items: baseline; height: 28px; border-bottom: 1px solid var(--line); }
  .sizes { display: grid; gap: 8px; }
  .sizes > div { display: flex; align-items: center; gap: 8px; }
  .still .spr { animation-play-state: paused !important; }
</style>
</head>
<body>
<h1>화면 설계도 — 배치만 (그림 칸은 빗금, 색감·글꼴은 지금 게임 그대로) · 2차: 지적 반영, 강약 조절</h1>
<div class="wrap" id="wrap"></div>
<script src="../../art.js"></script>
<script>
// a size to check (?w=390&h=844), the tap areas shown (?tap=1), the idle animation held (?still=1)
const Q = new URLSearchParams(location.search);
if (Q.get('w')) document.documentElement.style.setProperty('--fw', Q.get('w') + 'px');
if (Q.get('h')) document.documentElement.style.setProperty('--fh', Q.get('h') + 'px');
if (Q.get('tap')) document.body.classList.add('showtap');
if (Q.get('still')) document.body.classList.add('still');
// small pixel icons from the game's own art (art.js), drawn only at 16, 24 or 32 (scale 1, 1.5, 2)
function ico(name, s = 1) {
  const rows = ART.icons[name], c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  const g = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') { const [R, G, B] = ART.iconPal[ch]; g.fillStyle = `rgb(${R},${G},${B})`; g.fillRect(x, y, 1, 1); } }));
  return `<img class="ico" src="${c.toDataURL()}" style="width:${16 * s}px;height:${16 * s}px" alt="">`;
}
const img = (w, h, t = '그림') => `<div class="img" style="width:${w};height:${h}">${t}</div>`;
const GR = ['일반', '고급', '희귀', '영웅', '전설', '불멸', '신화', '영원'];
// the game's own pictures, drawn by its code (img/): people standing (idle, 4 frames), their faces as the game crops
// them now (20x20; the new 48x48 busts go in the same 48 slots), and the rifles as the game draws them now
const PEOPLE = { hero: ['나', 18, 30], minjun: ['민준', 18, 29], seoyeon: ['서연', 18, 29], doyun: ['도윤', 18, 29], haeun: ['하은', 18, 31], jiho: ['지호', 18, 32] };
const GUNS = [[18, 3], [20, 3], [22, 4], [23, 5], [26, 5], [23, 5]];
const gun = (k, s = 2) => `<img class="gun" src="img/gun-${k}.png" style="width:${GUNS[k][0] * s}px;height:${GUNS[k][1] * s}px" alt="">`;
const face = key => `<img class="por" src="img/face-${key}.png" style="width:40px;height:40px" alt="">`;
const sprite = (key, k) => { const [, w, h] = PEOPLE[key]; return `<span class="spr" style="display:block;width:${w * k}px;height:${h * k}px;background:url(img/idle-${key}.png) 0 0 / ${w * 4 * k}px ${h * k}px;image-rendering:pixelated;animation:idle${k} 1.333s steps(4) infinite"></span><style>@keyframes idle${k}{to{background-position:-${w * 4 * k}px 0}}</style>`; };
const nav = on => `<div class="nav">${[['bullet', '강화'], ['mag', '장비'], ['person', '캐릭터'], ['bunker', '기지'], ['coin', '상점']].map(([i, n]) => `<div class="${n === on ? 'on' : ''}">${ico(i, 2)}${n}</div>`).join('')}</div>`;
const head = (t, tabs, on) => `<div class="status">상태바</div><div class="head"><span>${t}</span><span class="ib tap" aria-label="닫기">${ico('close', 1.5)}</span></div>${tabs ? `<div class="tabs">${tabs.map(x => `<div class="${x === on ? 'on' : ''}">${x}</div>`).join('')}</div>` : ''}`;
const it = (g, l, n) => `<div class="it q${g}">${img('', '', '')}${l ? `<em>${l}</em>` : ''}${n ? `<u>${n}</u>` : ''}</div>`;
// v2 parts
const B = (cls, inner) => `<span class="b ${cls} tap">${inner}</span>`;
const cost = (res, n, short) => `${ico(res)}<span class="num${short ? ' short' : ''}">${n}</span>`;
const chip = (t, cls = '', g) => `<span class="chip tap ${cls}${g != null ? ' q' + g : ''}">${t}</span>`;
